name: Analytics Specialist (GitHub Actions + Claude)

# Objetivo de este workflow (ver docs/claude-employee-runtime.md): ejecutar
# el subagente analytics-specialist de principio a fin en GitHub Actions,
# SIN portatil encendido, SIN VPS, SIN Claude Routines y SIN Agent/Task
# anidado. La sesion principal de claude-code-action ES directamente el
# empleado (--agent analytics-specialist) -- nunca una sesion generica que
# a su vez invoca un subagente.
#
# Este workflow NO implementa el runtime generico el mismo (auth,
# invocacion de claude-code-action, fallback via execution_file, y
# validacion contra el JSON Schema versionado): eso lo hace
# .github/actions/claude-employee-runtime/action.yml, compartido por
# cualquier empleado Claude, sin modificar. Este fichero solo contiene lo
# ESPECIFICO del dominio de analytics-specialist: lectura del ultimo
# snapshot real de analytics-watcher, preparacion de su prompt, y la
# validacion/auditoria propia de AnalyticsSpecialistOutput -- ver
# src/employees/analytics-specialist/.
#
# NUNCA llama a GA4/GTM en vivo (eso solo lo hace analytics-watcher, con
# credenciales OAuth que este workflow no necesita ni concede). No hace
# deploy, no publica nada, no toca WordPress/staging/produccion/Ads/GA4/
# GTM/Search Console/n8n/VPS. El resultado se sube como artifact de GitHub
# Actions, nunca se commitea.

on:
  workflow_dispatch: {}
  # SIN "schedule:" a proposito -- ver docs/claude-employee-runtime.md,
  # paso 6 de "Como anadir un nuevo empleado": todo empleado nuevo se
  # prueba primero con workflow_dispatch unicamente. Activar `schedule`
  # requiere una validacion end-to-end real primero (este workflow no ha
  # tenido ninguna todavia -- no esta en la rama por defecto hasta que
  # este PR se mergee, y GitHub solo permite disparar workflow_dispatch
  # para ficheros ya presentes en la rama por defecto).

# Un solo empleado analytics-specialist corriendo a la vez: si ya hay una
# ejecucion en curso, la nueva ejecucion espera en cola en vez de correr
# en paralelo y arriesgarse a que dos ejecuciones escriban a la vez sobre
# los mismos reports/analytics-specialist/<departmentRunId>/.
concurrency:
  group: analytics-specialist
  cancel-in-progress: false

# Principio de minimo privilegio: este empleado NUNCA escribe en el repo
# (no commit, no push, no PR, no comentarios en issues/PRs) ni en GA4/GTM
# (no tiene credenciales de ningun sistema externo). Con `contents: read`
# alcanza.
permissions:
  contents: read

jobs:
  run-analytics-specialist:
    name: Ejecutar analytics-specialist
    runs-on: ubuntu-latest
    # Backstop de tiempo en dos capas (ver docs/claude-employee-runtime.md,
    # seccion de timeouts): timeout-minutes: 20 aqui es el limite del JOB
    # completo (incluye los pasos [DOMINIO] antes y despues del runtime);
    # el step "[RUNTIME]" mas abajo lleva su propio timeout-minutes: 10.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # --- [DOMINIO] Paso 1 del runner: lee el ultimo snapshot real de
      # analytics-watcher (event bus + informe Markdown ya persistido) y
      # prepara el contexto + prompt.md -- src/employees/analytics-specialist/context.ts,
      # scripts/run-analytics-specialist.ts, sin modificar. Puede terminar
      # en status="no_analytics_data" si analytics-watcher nunca se ha
      # ejecutado en este repositorio -- eso NO es un fallo del workflow. ---
      - name: "[DOMINIO] Runner (paso 1): leer ultimo snapshot de analytics-watcher + preparar contexto"
        id: prepare
        run: |
          set -o pipefail
          npm run analytics-specialist:run 2>&1 | tee runner-step1.log

      - name: "[DOMINIO] Parsear RUNNER_RESULT_JSON (paso 1)"
        id: step1
        run: npm run analytics-specialist:parse-runner-result-for-ci -- runner-step1.log

      - name: "[DOMINIO] Validar estado tras el paso 1 (no_analytics_data es un no-op valido, no un fallo)"
        run: |
          if [ "$STATUS" = "no_analytics_data" ]; then
            echo "::notice::Sin datos de analytics-watcher todavia -- $REASON. No se invoca a Claude en esta ejecucion (no-op valido, no un fallo)."
            exit 0
          fi
          if [ "$STATUS" != "pending_execution" ]; then
            echo "::error::status inesperado tras el paso 1 del runner: \"$STATUS\" (se esperaba no_analytics_data o pending_execution). Abortando antes de invocar a Claude."
            exit 1
          fi
          if [ ! -f "$PROMPT_FILE_PATH" ]; then
            echo "::error::promptFilePath no existe en disco: $PROMPT_FILE_PATH"
            exit 1
          fi
          echo "OK: status=pending_execution, promptFilePath existe ($PROMPT_FILE_PATH)."
        env:
          STATUS: ${{ steps.step1.outputs.status }}
          REASON: ${{ steps.step1.outputs.reason }}
          PROMPT_FILE_PATH: ${{ steps.step1.outputs.promptFilePath }}

      - name: "[DOMINIO] Leer contenido completo de prompt.md"
        id: read_prompt
        if: steps.step1.outputs.status == 'pending_execution'
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.step1.outputs.promptFilePath }}

      # --- [RUNTIME COMUN] Autenticacion + invocacion de claude-code-action
      # (--agent analytics-specialist) + resolucion structured_output/
      # fallback via execution_file + validacion contra
      # config/analytics-specialist-output.schema.json. Identico para
      # cualquier empleado Claude -- ver docs/claude-employee-runtime.md.
      # Solo corre si el paso 1 produjo un prompt real (status=pending_execution). ---
      - name: "[RUNTIME] Ejecutar analytics-specialist (Claude Employee Runtime)"
        id: runtime
        if: steps.step1.outputs.status == 'pending_execution'
        timeout-minutes: 22
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: analytics-specialist
          health-record-path: ${{ runner.temp }}/claude-runtime-health/analytics-specialist/claude-runtime-health.json
          prompt: ${{ steps.read_prompt.outputs.content }}
          output-schema-path: config/analytics-specialist-output.schema.json
          expected-output-path: ${{ steps.step1.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      # --- [DOMINIO] Paso 2 del runner: valida contra AnalyticsSpecialistOutput
      # + audita (metricas inventadas, HYPOTHESIS con lenguaje causal,
      # evidenceIds colgantes) -- sin modificar. Sale con codigo != 0 si el
      # status queda en "invalid_output". El fichero que lee
      # (expectedOutputPath) ya lo escribio el runtime comun en el step
      # anterior. ---
      - name: "[DOMINIO] Runner (paso 2): validar salida de Claude + auditar"
        id: step2_run
        if: steps.step1.outputs.status == 'pending_execution'
        run: |
          set -o pipefail
          npm run analytics-specialist:run -- --analytics-specialist-output "$EXPECTED_OUTPUT_PATH" 2>&1 | tee runner-step2.log
        env:
          EXPECTED_OUTPUT_PATH: ${{ steps.step1.outputs.expectedOutputPath }}

      - name: "[DOMINIO] Parsear RUNNER_RESULT_JSON (paso 2)"
        id: step2
        if: steps.step1.outputs.status == 'pending_execution'
        run: npm run analytics-specialist:parse-runner-result-for-ci -- runner-step2.log

      - name: "[DOMINIO] Subir artifact (artifact.json, artifact.md, output.json)"
        if: steps.step1.outputs.status == 'pending_execution'
        uses: actions/upload-artifact@v4
        with:
          name: analytics-specialist-${{ steps.step2.outputs.departmentRunId }}
          path: |
            ${{ steps.step2.outputs.artifactJsonPath }}
            ${{ steps.step2.outputs.artifactMdPath }}
            ${{ steps.step1.outputs.expectedOutputPath }}
          if-no-files-found: error
          retention-days: 90

      - name: "[DOMINIO] Generar GitHub Step Summary"
        if: always()
        run: |
          {
            echo "## Analytics Specialist"
            echo ""
            echo "- **agent:** analytics-specialist"
            if [ "$STEP1_STATUS" = "no_analytics_data" ]; then
              echo "- **status:** \`no_analytics_data\` (no-op valido -- analytics-watcher nunca ha registrado un snapshot en este repositorio)"
              echo "- **motivo:** $STEP1_REASON"
              echo "- **Claude execution:** no invocado en esta ejecucion"
              echo "- **artifact generado:** ninguno"
            else
              echo "- **departmentRunId (analytics-watcher):** \`$STEP2_DEPARTMENT_RUN_ID\`"
              echo "- **Claude execution (outcome del step, sin enmascarar por continue-on-error):** $CLAUDE_OUTCOME"
              echo "- **Origen de la salida:** $OUTPUT_SOURCE"
              echo "- **status:** \`$STEP2_STATUS\`"
              echo "- **auditWarnings:** $AUDIT_WARNING_COUNT"
              echo "- **artifact generado:** \`analytics-specialist-$STEP2_DEPARTMENT_RUN_ID\`"
            fi
            echo "- **Escritura externa realizada:** ninguna (GA4/GTM/WordPress/staging/produccion/Ads/Search Console/n8n/VPS no se han tocado; nada se ha commiteado)."
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ "$AUDIT_WARNING_COUNT" != "0" ] && [ "$AUDIT_WARNING_COUNT" != "null" ] && [ -n "$AUDIT_WARNING_COUNT" ]; then
              echo "> ⚠️ Hay avisos de auditoria (posibles metricas no rastreables, HYPOTHESIS con lenguaje causal, o referencias de evidencia colgantes) -- ver \`artifact.md\` del artifact. No se han descartado ni reinterpretado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEP1_STATUS: ${{ steps.step1.outputs.status }}
          STEP1_REASON: ${{ steps.step1.outputs.reason }}
          STEP2_STATUS: ${{ steps.step2.outputs.status }}
          STEP2_DEPARTMENT_RUN_ID: ${{ steps.step2.outputs.departmentRunId }}
          AUDIT_WARNING_COUNT: ${{ steps.step2.outputs.auditWarningCount }}
          # steps.runtime.outcome / .outputs.output-source: outputs
          # declarados por la composite action del runtime comun (ver
          # .github/actions/claude-employee-runtime/action.yml). Vacios si
          # el step "[RUNTIME]" no corrio (status=no_analytics_data).
          CLAUDE_OUTCOME: ${{ steps.runtime.outcome }}
          OUTPUT_SOURCE: ${{ steps.runtime.outputs.output-source == 'structured_output' && 'structured_output directo (caso A)' || (steps.runtime.outputs.output-source == 'execution_file_fallback' && 'fallback via execution_file (caso B)' || 'n/a') }}

      # --- [RUNTIME] Fiabilidad del runtime comun: agrega los
      # diagnosticos por invocacion (claude-runtime-health.json) de esta
      # pasada y los sube como artifact.
      #
      # `always()`: una pasada que FALLO es justo la que mas interesa
      # poder auditar despues. El agregador es fail-soft a proposito (no
      # puede tumbar el job): la autoridad sobre si el empleado fallo
      # sigue siendo el step del runtime, no esta metrica. ---
      - name: "[RUNTIME] Metricas de fiabilidad del runtime comun"
        if: always()
        run: npm run claude-runtime:metrics-for-ci -- "$HEALTH_DIR" "$HEALTH_DIR/claude-runtime-metrics.json" "Fiabilidad del runtime -- analytics-specialist"
        env:
          HEALTH_DIR: ${{ runner.temp }}/claude-runtime-health

      - name: "[RUNTIME] Subir diagnostico de fiabilidad del runtime"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-runtime-health-analytics-specialist-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-runtime-health/
          if-no-files-found: warn
          retention-days: 30
