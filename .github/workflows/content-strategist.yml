name: Content Strategist (GitHub Actions + Claude)

# Objetivo de este workflow (ver docs/claude-employee-runtime.md):
# ejecutar el subagente content-strategist de principio a fin en GitHub
# Actions, SIN portatil encendido, SIN VPS, SIN Claude Routines y SIN
# Agent/Task anidado. La sesion principal de claude-code-action ES
# directamente el empleado (--agent content-strategist) -- nunca una
# sesion generica que a su vez invoca un subagente.
#
# Este workflow NO implementa el runtime generico el mismo (auth,
# invocacion de claude-code-action, fallback via execution_file, y
# validacion contra el JSON Schema versionado): eso lo hace
# .github/actions/claude-employee-runtime/action.yml, compartido por
# cualquier empleado Claude. Este fichero solo contiene lo ESPECIFICO
# del dominio de content-strategist: seleccion de change pack de
# contenido, preparacion de su prompt, y la validacion/auditoria propia
# de ContentStrategistOutput -- ver
# src/employees/content-strategist/, sin tocar el runtime comun.
#
# No hace deploy, no publica nada, no toca WordPress/staging/produccion/
# Ads/GA4/GTM/Search Console/n8n/VPS. El resultado se sube como artifact
# de GitHub Actions, nunca se commitea.

on:
  workflow_dispatch:
    inputs:
      changePackId:
        description: >-
          ID de change pack de contenido especifico a procesar (opcional,
          solo para debugging manual). Vacio (por defecto) = el runner
          elige UNO al azar entre los elegibles (ready_for_review /
          approved_to_execute, changeType new_content_page/content_update).
        required: false
        type: string
  # SIN schedule -- este empleado todavia no tiene una validacion
  # end-to-end real (ver docs/claude-employee-runtime.md, "Como añadir un
  # nuevo empleado", paso 6: "Activa schedule solo despues de una
  # validacion end-to-end real"). Solo workflow_dispatch manual por ahora.

# Un solo empleado content-strategist corriendo a la vez: si ya hay una
# ejecucion en curso (p.ej. dos workflow_dispatch manuales solapados), la
# nueva ejecucion espera en cola en vez de correr en paralelo y
# arriesgarse a que dos ejecuciones escriban a la vez sobre los mismos
# reports/content-strategist/<changePackId>/.
concurrency:
  group: content-strategist
  cancel-in-progress: false

# Principio de minimo privilegio: este empleado NUNCA escribe en el repo
# (no commit, no push, no PR, no comentarios en issues/PRs). Con
# `contents: read` alcanza -- ver .github/actions/claude-employee-runtime/action.yml
# para por que hace falta pasar `github-token` explicitamente al runtime
# comun (para que claude-code-action respete este limite en vez de pedir
# un token propio con permisos de escritura).
permissions:
  contents: read

jobs:
  run-content-strategist:
    name: Ejecutar content-strategist
    runs-on: ubuntu-latest
    # Backstop de tiempo en dos capas (ver docs/claude-employee-runtime.md,
    # seccion de timeouts): los steps INTERNOS de la composite action
    # (.github/actions/claude-employee-runtime/action.yml) no soportan
    # timeout-minutes propio. El step del WORKFLOW CALLER que invoca
    # `uses: ./.github/actions/claude-employee-runtime` SI admite
    # timeout-minutes -- ver mas abajo, step "[RUNTIME] Ejecutar
    # content-strategist". Este timeout-minutes: 20 de aqui es el limite
    # del JOB completo (incluye los pasos de dominio antes y despues del
    # runtime).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # --- [DOMINIO] Paso 1 del runner: prepara UN change pack de
      # contenido + contexto + prompt.md -- ver
      # src/employees/content-strategist/, scripts/run-content-strategist.ts,
      # sin modificar el runtime comun. ---
      - name: "[DOMINIO] Runner (paso 1): preparar change pack de contenido + contexto"
        id: prepare
        run: |
          set -o pipefail
          if [ -n "$CHANGE_PACK_ID" ]; then
            npm run content-strategist:run -- --changePackId "$CHANGE_PACK_ID" 2>&1 | tee runner-step1.log
          else
            npm run content-strategist:run -- 2>&1 | tee runner-step1.log
          fi
        env:
          CHANGE_PACK_ID: ${{ inputs.changePackId }}

      - name: "[DOMINIO] Parsear RUNNER_RESULT_JSON (paso 1)"
        id: step1
        run: npm run content-strategist:parse-runner-result-for-ci -- runner-step1.log

      # No hay ningun change pack de contenido elegible ahora mismo: no
      # es un fallo real (no se ha inventado ninguna oportunidad), asi
      # que el job termina en verde sin invocar a Claude. El resto de
      # steps [RUNTIME]/paso 2/artifact se saltan via `if:` mas abajo.
      - name: "[DOMINIO] Validar estado tras el paso 1"
        run: |
          if [ "$STATUS" = "no_eligible_work" ]; then
            echo "::notice::No hay ningun change pack de contenido elegible ahora mismo (ready_for_review/approved_to_execute, changeType new_content_page/content_update). Terminando sin invocar a Claude -- no se ha fabricado ninguna oportunidad."
            exit 0
          fi
          if [ "$STATUS" != "pending_execution" ]; then
            echo "::error::status inesperado tras el paso 1 del runner: \"$STATUS\" (se esperaba pending_execution o no_eligible_work). Abortando antes de invocar a Claude."
            exit 1
          fi
          if [ ! -f "$PROMPT_FILE_PATH" ]; then
            echo "::error::promptFilePath no existe en disco: $PROMPT_FILE_PATH"
            exit 1
          fi
          echo "OK: status=pending_execution, promptFilePath existe ($PROMPT_FILE_PATH)."
        env:
          STATUS: ${{ steps.step1.outputs.status }}
          PROMPT_FILE_PATH: ${{ steps.step1.outputs.promptFilePath }}

      - name: "[DOMINIO] Leer contenido completo del prompt"
        id: read_prompt
        if: steps.step1.outputs.status == 'pending_execution'
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.step1.outputs.promptFilePath }}

      # --- [RUNTIME COMUN] Autenticacion + invocacion de
      # claude-code-action (--agent content-strategist) + resolucion
      # structured_output/fallback via execution_file + validacion contra
      # config/content-strategist-output.schema.json. Identico para
      # cualquier empleado Claude -- ver docs/claude-employee-runtime.md. ---
      - name: "[RUNTIME] Ejecutar content-strategist (Claude Employee Runtime)"
        id: runtime
        if: steps.step1.outputs.status == 'pending_execution'
        # timeout-minutes SI es valido aqui (step normal del workflow
        # caller, no un step interno de la composite action) -- limita
        # TODA la composite action (auth + preflights + claude-code-action
        # + resolucion de salida) a 10 min. Copiado tal cual del template
        # de ux-ui-landing-architect-v2 (ver docs/claude-employee-runtime.md).
        timeout-minutes: 10
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: content-strategist
          prompt: ${{ steps.read_prompt.outputs.content }}
          output-schema-path: config/content-strategist-output.schema.json
          expected-output-path: ${{ steps.step1.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      # --- [DOMINIO] Paso 2 del runner: valida contra ContentStrategistOutput
      # + audita afirmaciones sin respaldo / enlaces inventados -- sin
      # modificar el runtime comun. Sale con codigo != 0 (sin
      # continue-on-error) si status queda en "invalid_output". El
      # fichero que lee (expectedOutputPath) ya lo escribio el runtime
      # comun en el step anterior. ---
      - name: "[DOMINIO] Runner (paso 2): validar salida de Claude + auditar afirmaciones sin respaldo"
        if: steps.step1.outputs.status == 'pending_execution'
        run: |
          set -o pipefail
          npm run content-strategist:run -- --changePackId "$CHANGE_PACK_ID" --content-strategist-output "$EXPECTED_OUTPUT_PATH" 2>&1 | tee runner-step2.log
        env:
          CHANGE_PACK_ID: ${{ steps.step1.outputs.changePackId }}
          EXPECTED_OUTPUT_PATH: ${{ steps.step1.outputs.expectedOutputPath }}

      - name: "[DOMINIO] Parsear RUNNER_RESULT_JSON (paso 2)"
        id: step2
        if: steps.step1.outputs.status == 'pending_execution'
        run: npm run content-strategist:parse-runner-result-for-ci -- runner-step2.log

      - name: "[DOMINIO] Subir artifact (brief.json, brief.md, output.json)"
        if: steps.step1.outputs.status == 'pending_execution'
        uses: actions/upload-artifact@v4
        with:
          name: content-strategist-${{ steps.step2.outputs.changePackId }}
          path: |
            ${{ steps.step2.outputs.artifactJsonPath }}
            ${{ steps.step2.outputs.artifactMdPath }}
            ${{ steps.step1.outputs.expectedOutputPath }}
          if-no-files-found: error
          retention-days: 90

      # --- [DOMINIO] Step Summary -- corre SIEMPRE (incluido el caso
      # no_eligible_work), leyendo del paso 2 si llego a ejecutarse y del
      # paso 1 si no. ---
      - name: "[DOMINIO] Generar GitHub Step Summary"
        if: always()
        run: |
          {
            echo "## content-strategist"
            echo ""
            echo "- **agente:** content-strategist"
            echo "- **status (paso 1):** \`$STATUS_STEP1\`"
            if [ -n "$STATUS_STEP2" ]; then
              echo "- **status (paso 2):** \`$STATUS_STEP2\`"
            fi
            echo "- **change pack seleccionado:** \`${CHANGE_PACK_ID:-(ninguno)}\`"
            echo "- **keyword:** ${KEYWORD:-(ninguna)}"
            if [ -n "$CLAUDE_OUTCOME" ]; then
              echo "- **Claude execution (outcome del step, sin enmascarar por continue-on-error):** $CLAUDE_OUTCOME"
              echo "- **Origen de la salida:** $OUTPUT_SOURCE"
            fi
            echo "- **avisos de auditoria (auditWarningCount):** ${AUDIT_WARNING_COUNT:-null}"
            if [ -n "$ARTIFACT_NAME" ]; then
              echo "- **artifact generado:** \`$ARTIFACT_NAME\`"
            else
              echo "- **artifact generado:** ninguno (sin trabajo elegible, no se invoco a Claude)"
            fi
            echo "- **escritura externa realizada:** ninguna (WordPress/staging/produccion/Ads/GA4/GTM/Search Console/n8n/VPS no se han tocado; nada se ha commiteado)."
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ "$AUDIT_WARNING_COUNT" != "0" ] && [ "$AUDIT_WARNING_COUNT" != "null" ] && [ -n "$AUDIT_WARNING_COUNT" ]; then
              echo "> ⚠️ Hay avisos de posibles afirmaciones/enlaces sin respaldo en el input (ver brief.md del artifact) -- revisar antes de dar por bueno este brief. No se han descartado ni reinterpretado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STATUS_STEP1: ${{ steps.step1.outputs.status }}
          STATUS_STEP2: ${{ steps.step2.outputs.status }}
          CHANGE_PACK_ID: ${{ steps.step2.outputs.changePackId || steps.step1.outputs.changePackId }}
          KEYWORD: ${{ steps.step2.outputs.keyword || steps.step1.outputs.keyword }}
          AUDIT_WARNING_COUNT: ${{ steps.step2.outputs.auditWarningCount }}
          ARTIFACT_NAME: ${{ steps.step1.outputs.status == 'pending_execution' && format('content-strategist-{0}', steps.step2.outputs.changePackId) || '' }}
          # steps.runtime.outputs.claude-outcome / .output-source: outputs
          # declarados por la composite action del runtime comun (ver
          # .github/actions/claude-employee-runtime/action.yml).
          CLAUDE_OUTCOME: ${{ steps.runtime.outputs.claude-outcome }}
          OUTPUT_SOURCE: ${{ steps.runtime.outputs.output-source == 'structured_output' && 'structured_output directo (caso A)' || (steps.runtime.outputs.output-source == 'execution_file_fallback' && 'fallback via execution_file (caso B)' || '') }}
