name: execute-php -- E2E reversible en STAGING

# E2E del fallback controlado `novamira/execute-php`. Ver
# docs/execute-php-fallback.md.
#
# QUE HACE: sobre UNA pagina publicada de staging, cambia una frase
# (post_excerpt), lo valida releyendo por un camino distinto al de la
# escritura, y lo REVIERTE dejando la pagina byte a byte como estaba.
#
# ESCRITURAS: 2 en staging (el cambio y su reversion). 0 en produccion.
# El guard bloquea produccion de forma incondicional y el executor no
# tiene ninguna via para alcanzarla.
#
# QUE SE EJECUTA lo decide reports/execute-php-e2e/e2e-request.json, que
# esta commiteado: `mode: list` solo lee; `mode: run` + `postId` ejecuta
# el E2E sobre esa pagina. Cada modificacion de ese fichero queda en el
# historial de git, asi que la autorizacion de cada ejecucion concreta es
# auditable y no depende de quien pulse un boton.
#
# SOLO `workflow_dispatch`: este workflow ESCRIBE en staging, asi que
# nunca debe dispararse solo. Durante el desarrollo hubo un trigger
# `push` temporal (GitHub no permite `workflow_dispatch` para un workflow
# que aun no esta en la rama por defecto); se elimino al mergear, que era
# justo la condicion que lo hacia necesario.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list / ability-info (solo lectura) | run (E2E completo, ESCRIBE en staging)"
        required: true
        default: "list"
        type: choice
        options: ["list", "ability-info", "run"]
      postId:
        description: "ID de la pagina de staging (solo para mode=run y para certifyDepartmentPath)"
        required: false
        type: string
      inspectPostId:
        description: >-
          SOLO LECTURA. Imprime el estado actual (status, title, excerpt)
          de esa pagina de staging y si contiene el marcador de
          certificacion. No escribe nada.
        required: false
        type: string
      restoreExcerpt:
        description: >-
          Restaura el extracto de la pagina indicada en postId al texto
          exacto que se ponga aqui. Solo para devolver staging a un estado
          conocido despues de un apply que fallo a medias.
        required: false
        type: string
      certifyDepartmentPath:
        description: >-
          En vez del E2E del executor, certificar el CAMINO COMPLETO del
          departamento: recomendacion -> ChangePlan -> resolucion contra el
          inventario real -> contrato de apply -> apply en staging ->
          read-back -> revert por el mismo camino. Usa un ChangePlan
          controlado y reversible; no toca ninguna recomendacion real.
        required: false
        default: false
        type: boolean

concurrency:
  group: execute-php-staging-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: E2E reversible en staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolver la peticion (fichero commiteado o inputs del dispatch)
        id: request
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.mode }}" ]; then
            MODE="${{ inputs.mode }}"
            POST_ID="${{ inputs.postId }}"
          else
            MODE=$(node -e 'console.log(require("./reports/execute-php-e2e/e2e-request.json").mode)')
            POST_ID=$(node -e 'console.log(require("./reports/execute-php-e2e/e2e-request.json").postId)')
            ABILITY=$(node -e 'console.log(require("./reports/execute-php-e2e/e2e-request.json").ability || "")')
          fi
          if [ "$MODE" != "list" ] && [ "$MODE" != "run" ] && [ "$MODE" != "ability-info" ]; then
            echo "mode=\"$MODE\" desconocido. Fail-closed: no se ejecuta nada."
            exit 1
          fi
          if [ "$MODE" = "run" ] && { [ -z "$POST_ID" ] || [ "$POST_ID" = "0" ]; }; then
            echo "mode=run sin postId. Fail-closed: no se escribe en una pagina que nadie ha elegido."
            exit 1
          fi
          {
            echo "mode=$MODE"
            echo "postId=$POST_ID"
            echo "ability=${ABILITY:-}"
          } >> "$GITHUB_OUTPUT"
          echo "Modo resuelto: $MODE (postId=$POST_ID)."

      # ESTE workflow tiene dos modos, y son complementarios, no
      # redundantes:
      #
      #   E2E                      certifica el EXECUTOR: que
      #                            `novamira/execute-php` sabe escribir en
      #                            staging y revertir.
      #   certifyDepartmentPath    certifica el CAMINO del departamento
      #                            HASTA ese executor -- que es justo
      #                            donde estaban los cortes: un ChangePlan
      #                            que se construia bien y despues se
      #                            descartaba en silencio en la fase de
      #                            apply.
      #
      # Tener el executor probado no demuestra lo segundo, y por eso hace
      # falta el segundo modo.
      - name: E2E
        if: ${{ !inputs.certifyDepartmentPath }}
        run: |
          set -o pipefail
          if [ "$MODE" = "ability-info" ] && [ -n "$ABILITY" ]; then
            npx ts-node scripts/o47-execute-php-e2e.ts --mode ability-info --ability "$ABILITY"
          elif [ "$MODE" != "run" ]; then
            npx ts-node scripts/o47-execute-php-e2e.ts --mode "$MODE"
          else
            npx ts-node scripts/o47-execute-php-e2e.ts --mode run --postId "$POST_ID"
          fi
        env:
          MODE: ${{ steps.request.outputs.mode }}
          POST_ID: ${{ steps.request.outputs.postId }}
          ABILITY: ${{ steps.request.outputs.ability }}
          # Entorno: STAGING y nada mas. Ninguna variable de produccion se
          # expone a este job, ni siquiera apagada.
          WORDPRESS_ENV: staging
          # Los DOS interruptores del fallback. Apagar cualquiera lo desactiva.
          NOVAMIRA_STAGING_WRITES_ENABLED: "true"
          NOVAMIRA_EXECUTE_PHP_FALLBACK_ENABLED: "true"
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
          WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}

      - name: "Inspeccionar una pagina de staging (SOLO LECTURA)"
        if: ${{ inputs.inspectPostId != '' }}
        run: npx ts-node scripts/certify-department-changeplan-apply.ts --inspect --postId "$INSPECT_POST_ID"
        env:
          INSPECT_POST_ID: ${{ inputs.inspectPostId }}
          WORDPRESS_ENV: staging
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
          WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}

      - name: "Restaurar el extracto de una pagina a un valor conocido"
        if: ${{ inputs.restoreExcerpt != '' }}
        run: npx ts-node scripts/certify-department-changeplan-apply.ts --postId "$POST_ID" --restoreExcerpt "$RESTORE_EXCERPT"
        env:
          POST_ID: ${{ inputs.postId }}
          RESTORE_EXCERPT: ${{ inputs.restoreExcerpt }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
          DEPARTMENT_PERSISTENCE_MODE: ${{ secrets.MONGODB_URI != '' && 'mongo' || 'legacy' }}
          WORDPRESS_ENV: staging
          NOVAMIRA_STAGING_WRITES_ENABLED: "true"
          NOVAMIRA_EXECUTE_PHP_FALLBACK_ENABLED: "true"
          WORDPRESS_DRAFTS_ENABLED: "true"
          DEPARTMENT_STAGING_APPLY_ENABLED: "true"
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
          WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}

      - name: Certificar el camino COMPLETO del departamento (ChangePlan -> apply en staging)
        if: ${{ inputs.certifyDepartmentPath }}
        run: |
          set -o pipefail
          if [ -n "$POST_ID" ]; then
            npx ts-node scripts/certify-department-changeplan-apply.ts --postId "$POST_ID"
          else
            npx ts-node scripts/certify-department-changeplan-apply.ts
          fi
        env:
          POST_ID: ${{ inputs.postId }}
          # Estado autoritativo: el cambio tiene que quedar REGISTRADO. Sin
          # sitio donde registrarlo, la fase de apply se niega a escribir.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
          DEPARTMENT_PERSISTENCE_MODE: ${{ secrets.MONGODB_URI != '' && 'mongo' || 'legacy' }}
          # Entorno: STAGING y nada mas, igual que el E2E.
          WORDPRESS_ENV: staging
          NOVAMIRA_STAGING_WRITES_ENABLED: "true"
          NOVAMIRA_EXECUTE_PHP_FALLBACK_ENABLED: "true"
          WORDPRESS_DRAFTS_ENABLED: "true"
          DEPARTMENT_STAGING_APPLY_ENABLED: "true"
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
          WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
          # Lectura por REST: via DISTINTA de la de escritura, que es lo
          # que hace que el read-back signifique algo.
          WORDPRESS_STAGING_BASE_URL: ${{ secrets.WORDPRESS_STAGING_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}

      - name: Subir el informe de la certificacion del camino
        if: ${{ always() && inputs.certifyDepartmentPath }}
        uses: actions/upload-artifact@v4
        with:
          name: department-changeplan-certification
          path: |
            reports/department-apply-certification/
            reports/department/cert-*/
          if-no-files-found: warn
          retention-days: 90

      - name: Subir el informe del E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execute-php-e2e
          path: reports/execute-php-e2e/
          if-no-files-found: warn
          retention-days: 90

      - name: Resumen
        if: always()
        run: |
          {
            echo "## execute-php -- E2E en STAGING"
            echo ""
            echo "- **Modo:** \`${{ steps.request.outputs.mode }}\`"
            echo "- **postId:** \`${{ steps.request.outputs.postId }}\`"
            echo "- **Escrituras en produccion:** 0 (el guard bloquea produccion de forma incondicional)"
            echo ""
            echo "El detalle (BEFORE, cambio temporal, AFTER, reversion y read-back final) esta en el log del step \"E2E\" y en el artifact."
          } >> "$GITHUB_STEP_SUMMARY"
