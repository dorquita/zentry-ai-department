name: Certificacion -- ChangePlan por el camino del departamento

# QUE CERTIFICA ESTE WORKFLOW.
#
#     recomendacion -> ChangePlan -> resolucion contra el inventario REAL
#     -> contrato de apply -> APPLY EN STAGING -> read-back -> validacion
#     -> revert por el MISMO camino -> read-back final
#
# POR QUE HACE FALTA, teniendo la pasada diaria. Porque la pasada diaria
# puede concluir, legitimamente, que hoy no hay ningun cambio que merezca
# la pena hacer -- y ese es un resultado correcto que no se fuerza. Pero
# entonces esa pasada no demuestra que el sistema SEPA ejecutar un
# ChangePlan cuando si lo hay. Esto lo demuestra, con un cambio
# controlado y reversible, sin tocar ninguna recomendacion real.
#
# EN QUE SE DIFERENCIA DE execute-php-staging-e2e.yml. Aquel certifica el
# EXECUTOR (que `novamira/execute-php` sabe escribir y revertir). Este
# certifica el CAMINO COMPLETO del departamento hasta ese executor, que
# es justo donde estaban los cortes: un ChangePlan que se construia bien
# y despues se descartaba en silencio en la fase de apply.
#
# SOLO `workflow_dispatch`: este workflow ESCRIBE en staging.

on:
  workflow_dispatch:
    inputs:
      postId:
        description: >-
          ID de la pagina de staging a usar como destino. Si se deja vacio
          se elige de forma determinista la primera pagina publicada con
          URL y con extracto no vacio.
        required: false
        type: string

concurrency:
  group: department-changeplan-certification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify:
    name: ChangePlan controlado y reversible en staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Certificar el camino completo
        run: |
          set -o pipefail
          if [ -n "${{ inputs.postId }}" ]; then
            npx ts-node scripts/certify-department-changeplan-apply.ts --postId "${{ inputs.postId }}"
          else
            npx ts-node scripts/certify-department-changeplan-apply.ts
          fi
        env:
          # Estado autoritativo: el cambio tiene que quedar REGISTRADO. Sin
          # sitio donde registrarlo, la fase de apply se niega a escribir.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
          DEPARTMENT_PERSISTENCE_MODE: ${{ secrets.MONGODB_URI != '' && 'mongo' || 'legacy' }}
          # Novamira / execute-php: las MISMAS credenciales que el E2E ya
          # certificado.
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
          WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
          # Lectura por REST -- via distinta de la de escritura, que es lo
          # que hace que el read-back signifique algo.
          WORDPRESS_STAGING_BASE_URL: ${{ secrets.WORDPRESS_STAGING_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          # Entorno: STAGING y nada mas. Ninguna variable de produccion se
          # expone a este job, ni siquiera apagada.
          WORDPRESS_ENV: staging
          WORDPRESS_DRAFTS_ENABLED: "true"
          DEPARTMENT_STAGING_APPLY_ENABLED: "true"
          NOVAMIRA_EXECUTE_PHP_FALLBACK_ENABLED: "true"
          NOVAMIRA_STAGING_WRITES_ENABLED: "true"

      - name: Subir el informe de la certificacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: department-changeplan-certification
          path: |
            reports/department-apply-certification/
            reports/department/cert-*/
          if-no-files-found: warn
          retention-days: 90

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Certificacion del camino ChangePlan -> apply en staging"
            echo ""
            echo "- **Escrituras en produccion:** 0 (inalcanzable desde este job: no recibe credenciales de produccion, el entorno es staging y tres capas de guard lo rechazan por separado)"
            echo ""
            echo "El BEFORE, el cambio aplicado, el read-back, la reversion y la comprobacion final estan en el log del step de certificacion y en el artifact."
          } >> "$GITHUB_STEP_SUMMARY"
