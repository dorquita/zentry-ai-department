name: Web Engineer (GitHub Actions + Claude)

# Objetivo de este workflow (ver docs/claude-employee-runtime.md):
# ejecutar el subagente web-engineer de principio a fin en GitHub
# Actions, SIN portatil encendido, SIN VPS, SIN Claude Routines y SIN
# Agent/Task anidado. La sesion principal de claude-code-action ES
# directamente el empleado (--agent web-engineer) -- nunca una sesion
# generica que a su vez invoca un subagente.
#
# Este workflow NO implementa el runtime generico el mismo (auth,
# invocacion de claude-code-action, fallback via execution_file, y
# validacion contra el JSON Schema versionado): eso lo hace
# .github/actions/claude-employee-runtime/action.yml, compartido por
# cualquier empleado Claude, sin modificar. Este fichero solo contiene lo
# ESPECIFICO del dominio de web-engineer: seleccion de ChangePack,
# preparacion de su prompt, y la validacion/auditoria propia de
# WebEngineerOutput -- ver src/employees/web-engineer/, sin tocar el
# runtime comun.
#
# EN ESTA FASE NO SE ESCRIBE EN WORDPRESS NI EN NINGUN OTRO SISTEMA. Este
# empleado SOLO produce una especificacion tecnica (approvalRequired
# siempre true, verificado por validateWebEngineerOutput). No hace
# deploy, no publica nada, no toca WordPress/staging/produccion/Ads/
# GA4/GTM/Search Console/n8n/VPS. El resultado se sube como artifact de
# GitHub Actions, nunca se commitea.

on:
  workflow_dispatch:
    inputs:
      changePackId:
        description: >-
          ID de change pack especifico a procesar (opcional, solo para
          debugging manual). Vacio (por defecto) = el runner elige UNO al
          azar entre los elegibles (ready_for_review / approved_to_execute).
        required: false
        type: string
  # SIN schedule: por diseno, hasta que exista una primera validacion
  # end-to-end real de este empleado (ver docs/claude-employee-runtime.md,
  # "Cómo añadir un nuevo empleado", paso 6 -- mismo criterio que se
  # aplico a ux-ui-landing-architect-v2 antes de activar su cron). Solo
  # workflow_dispatch por ahora.

# Un solo empleado web-engineer corriendo a la vez: si ya hay una
# ejecucion en curso (p.ej. un workflow_dispatch manual solapado con
# otro), la nueva ejecucion espera en cola en vez de correr en paralelo y
# arriesgarse a que dos ejecuciones escriban a la vez sobre los mismos
# reports/web-engineer/<changePackId>/.
concurrency:
  group: web-engineer
  cancel-in-progress: false

# Principio de minimo privilegio: este empleado NUNCA escribe en el repo
# (no commit, no push, no PR, no comentarios en issues/PRs) NI en ningun
# sistema externo (ni siquiera WordPress). Con `contents: read` alcanza
# -- ver .github/actions/claude-employee-runtime/action.yml para por que
# hace falta pasar `github-token` explicitamente al runtime comun (para
# que claude-code-action respete este limite en vez de pedir un token
# propio con permisos de escritura).
permissions:
  contents: read

jobs:
  run-web-engineer:
    name: Ejecutar web-engineer
    runs-on: ubuntu-latest
    # Backstop de tiempo en dos capas (ver docs/claude-employee-runtime.md,
    # seccion de timeouts): los steps INTERNOS de la composite action
    # (.github/actions/claude-employee-runtime/action.yml) no soportan
    # timeout-minutes individual. El step del workflow CALLER que invoca
    # la composite action (mas abajo, "[RUNTIME] Ejecutar...") SI admite
    # timeout-minutes -- ese limita auth + preflights + Claude +
    # resolucion de salida a 10 min. Este timeout-minutes: 20 de aqui es
    # el limite del JOB completo (incluye los pasos [DOMINIO] antes y
    # despues del runtime).
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # --- [DOMINIO] Paso 1 del runner: selecciona UN ChangePack elegible
      # + construye WebEngineerContext (enriquecido con
      # existing-page-audit / staging-qa-results reales cuando existen) +
      # escribe prompt.md -- src/employees/web-engineer/{context,change-pack-selection}.ts,
      # scripts/run-web-engineer.ts, sin modificar el runtime comun. ---
      - name: "[DOMINIO] Runner (paso 1): preparar change pack + contexto tecnico"
        id: prepare
        run: |
          set -o pipefail
          if [ -n "$CHANGE_PACK_ID" ]; then
            npm run web-engineer:run -- --changePackId "$CHANGE_PACK_ID" 2>&1 | tee runner-step1.log
          else
            npm run web-engineer:run -- 2>&1 | tee runner-step1.log
          fi
        env:
          CHANGE_PACK_ID: ${{ inputs.changePackId }}

      - name: "[DOMINIO] Parsear RUNNER_RESULT_JSON (paso 1)"
        id: step1
        run: npm run web-engineer:parse-runner-result-for-ci -- runner-step1.log

      - name: "[DOMINIO] Validar estado tras el paso 1 (pending_execution + prompt existe)"
        run: |
          if [ "$WE_STATUS" != "pending_execution" ]; then
            echo "::error::status inesperado tras el paso 1 del runner: \"$WE_STATUS\" (se esperaba pending_execution). Abortando antes de invocar a Claude."
            exit 1
          fi
          if [ ! -f "$PROMPT_FILE_PATH" ]; then
            echo "::error::promptFilePath no existe en disco: $PROMPT_FILE_PATH"
            exit 1
          fi
          echo "OK: status=pending_execution, promptFilePath existe ($PROMPT_FILE_PATH)."
        env:
          WE_STATUS: ${{ steps.step1.outputs.status }}
          PROMPT_FILE_PATH: ${{ steps.step1.outputs.promptFilePath }}

      - name: "[DOMINIO] Leer contenido completo de prompt.md"
        id: read_prompt
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.step1.outputs.promptFilePath }}

      # --- [RUNTIME COMUN] Autenticacion + invocacion de
      # claude-code-action (--agent web-engineer) + resolucion
      # structured_output/fallback via execution_file + validacion contra
      # config/web-engineer-output.schema.json. Identico para cualquier
      # empleado Claude -- ver docs/claude-employee-runtime.md. ---
      - name: "[RUNTIME] Ejecutar web-engineer (Claude Employee Runtime)"
        id: runtime
        # timeout-minutes SI es valido aqui (step normal del workflow
        # caller, no un step interno de la composite action) -- limita
        # TODA la composite action (auth + preflights + claude-code-action
        # + resolucion de salida) a 10 min.
        timeout-minutes: 22
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: web-engineer
          health-record-path: ${{ runner.temp }}/claude-runtime-health/web-engineer/claude-runtime-health.json
          prompt: ${{ steps.read_prompt.outputs.content }}
          output-schema-path: config/web-engineer-output.schema.json
          expected-output-path: ${{ steps.step1.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      # --- [DOMINIO] Paso 2 del runner: valida contra WebEngineerOutput
      # (fail-closed, incluida la regla approvalRequired === true) +
      # audita afirmaciones de capacidad tecnica no confirmada -- sin
      # modificar el runtime comun. Sale con codigo != 0 (sin
      # continue-on-error) si status queda en "invalid_output". El
      # fichero que lee (expectedOutputPath) ya lo escribio el runtime
      # comun en el step anterior. ---
      - name: "[DOMINIO] Runner (paso 2): validar salida de Claude + auditar capacidad tecnica"
        run: |
          set -o pipefail
          npm run web-engineer:run -- --changePackId "$CHANGE_PACK_ID" --web-engineer-output "$EXPECTED_OUTPUT_PATH" 2>&1 | tee runner-step2.log
        env:
          CHANGE_PACK_ID: ${{ steps.step1.outputs.changePackId }}
          EXPECTED_OUTPUT_PATH: ${{ steps.step1.outputs.expectedOutputPath }}

      - name: "[DOMINIO] Parsear RUNNER_RESULT_JSON (paso 2)"
        id: step2
        run: npm run web-engineer:parse-runner-result-for-ci -- runner-step2.log

      - name: "[DOMINIO] Subir artifact (spec.json, spec.md, web-engineer-output.json)"
        uses: actions/upload-artifact@v4
        with:
          name: web-engineer-${{ steps.step2.outputs.changePackId }}
          path: |
            ${{ steps.step2.outputs.specJsonPath }}
            ${{ steps.step2.outputs.specMdPath }}
            ${{ steps.step1.outputs.expectedOutputPath }}
          if-no-files-found: error
          retention-days: 90

      - name: "[DOMINIO] Generar GitHub Step Summary"
        run: |
          {
            echo "## Web Engineer"
            echo ""
            echo "- **changePackId:** \`$CHANGE_PACK_ID\`"
            echo "- **keyword:** $KEYWORD"
            echo "- **Claude execution (outcome del step, sin enmascarar por continue-on-error):** $CLAUDE_OUTCOME"
            echo "- **Origen de la salida:** $OUTPUT_SOURCE"
            echo "- **status:** \`$WE_STATUS\`"
            echo "- **capabilityAuditWarnings:** $CAPABILITY_AUDIT_WARNING_COUNT"
            echo "- **artifact generado:** \`web-engineer-$CHANGE_PACK_ID\`"
            echo "- **Escritura externa realizada:** ninguna (WordPress/staging/produccion/Ads/GA4/GTM/Search Console/n8n/VPS no se han tocado; nada se ha commiteado; esta fase es exclusivamente de especificacion, approvalRequired siempre true)."
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ "$CAPABILITY_AUDIT_WARNING_COUNT" != "0" ] && [ "$CAPABILITY_AUDIT_WARNING_COUNT" != "null" ]; then
              echo "> ⚠️ Hay avisos de afirmaciones de capacidad tecnica (plugin/tema/API/pagina) sin respaldo en el contexto (listados abajo, y tambien en \`spec.md\` del artifact) -- revisar antes de dar por buena esta especificacion. No se han descartado ni reinterpretado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CHANGE_PACK_ID: ${{ steps.step2.outputs.changePackId }}
          KEYWORD: ${{ steps.step2.outputs.keyword }}
          WE_STATUS: ${{ steps.step2.outputs.status }}
          CAPABILITY_AUDIT_WARNING_COUNT: ${{ steps.step2.outputs.capabilityAuditWarningCount }}
          # steps.runtime.outputs.claude-outcome / .output-source: outputs
          # declarados por la composite action del runtime comun (ver
          # .github/actions/claude-employee-runtime/action.yml).
          CLAUDE_OUTCOME: ${{ steps.runtime.outputs.claude-outcome }}
          OUTPUT_SOURCE: ${{ steps.runtime.outputs.output-source == 'structured_output' && 'structured_output directo (caso A)' || (steps.runtime.outputs.output-source == 'execution_file_fallback' && 'fallback via execution_file (caso B)' || 'ninguno (caso C, el workflow ya deberia haber fallado antes de este step)') }}

      # --- [DOMINIO] Muestra los capabilityAuditWarnings REALES (leidos
      # tal cual de spec.json via extractCapabilityAuditWarnings(),
      # src/employees/web-engineer/spec-artifact-reader.ts) en el Step
      # Summary cuando los hay -- nunca se le pide a Claude que los
      # resuma ni reinterprete. No escribe nada (y no falla) si el array
      # esta vacio. ---
      - name: "[DOMINIO] Mostrar capabilityAuditWarnings reales en el Step Summary (si los hay)"
        run: npm run web-engineer:print-capability-warnings-for-ci -- "$SPEC_JSON_PATH"
        env:
          SPEC_JSON_PATH: ${{ steps.step2.outputs.specJsonPath }}

      # --- [RUNTIME] Fiabilidad del runtime comun: agrega los
      # diagnosticos por invocacion (claude-runtime-health.json) de esta
      # pasada y los sube como artifact.
      #
      # `always()`: una pasada que FALLO es justo la que mas interesa
      # poder auditar despues. El agregador es fail-soft a proposito (no
      # puede tumbar el job): la autoridad sobre si el empleado fallo
      # sigue siendo el step del runtime, no esta metrica. ---
      - name: "[RUNTIME] Metricas de fiabilidad del runtime comun"
        if: always()
        run: npm run claude-runtime:metrics-for-ci -- "$HEALTH_DIR" "$HEALTH_DIR/claude-runtime-metrics.json" "Fiabilidad del runtime -- web-engineer"
        env:
          HEALTH_DIR: ${{ runner.temp }}/claude-runtime-health

      - name: "[RUNTIME] Subir diagnostico de fiabilidad del runtime"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-runtime-health-web-engineer-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-runtime-health/
          if-no-files-found: warn
          retention-days: 30
