name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Para poder verificar typecheck + tests en una rama de trabajo ANTES
  # de abrir la PR. No cambia nada de lo que ejecuta: los mismos dos
  # pasos, sin secretos y sin permisos de escritura.
  workflow_dispatch:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
