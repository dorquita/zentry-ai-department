name: UX/UI Landing Architect v2 (GitHub Actions + Claude)

# Objetivo de este workflow (ver docs/ux-ui-landing-architect-v2-experiment.md
# y docs/claude-employee-runtime.md): ejecutar el subagente
# ux-ui-landing-architect-v2 de principio a fin en GitHub Actions, SIN
# portatil encendido, SIN VPS, SIN Claude Routines y SIN Agent/Task
# anidado. La sesion principal de claude-code-action ES directamente el
# empleado (--agent ux-ui-landing-architect-v2) -- nunca una sesion
# generica que a su vez invoca un subagente.
#
# Este workflow ya NO implementa el runtime generico el mismo (auth,
# invocacion de claude-code-action, fallback via execution_file, y
# validacion contra el JSON Schema versionado): eso lo hace
# .github/actions/claude-employee-runtime/action.yml, compartido por
# cualquier empleado Claude futuro. Este fichero solo contiene lo
# ESPECIFICO del dominio de ux-ui-landing-architect-v2: seleccion de
# change pack, preparacion de su prompt, y la validacion/auditoria propia
# de LandingArchitectV2Output (comparacion V1/V2, fabrication audit) --
# ver src/core/landing-architect-comparison.ts, sin modificar.
#
# No hace deploy, no publica nada, no toca WordPress/staging/produccion/
# Ads/GA4/GTM/Search Console/n8n/VPS. El resultado se sube como artifact
# de GitHub Actions, nunca se commitea.

on:
  workflow_dispatch:
    inputs:
      changePackId:
        description: >-
          ID de change pack especifico a procesar (opcional, solo para
          debugging manual). Vacio (por defecto) = el runner elige UNO al
          azar entre los elegibles (ready_for_review / approved_to_execute).
        required: false
        type: string
  # Ejecucion automatica diaria -- ACTIVADA tras la primera validacion
  # end-to-end real (run 31851396385, ver
  # docs/ux-ui-landing-architect-v2-experiment.md). 1 vez al dia, a las
  # 07:00 UTC en punto -- GitHub Actions evalua el cron SIEMPRE en UTC,
  # sin conversion a ninguna zona horaria local. El runner ya limita a un
  # UNICO change pack por ejecucion por diseno (ver
  # src/core/landing-architect-change-pack-selection.ts). SIN CAMBIOS
  # respecto a antes de la migracion al runtime comun (PR #6).
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC diario (no una hora local fija)

# Un solo empleado ux-ui-landing-architect-v2 corriendo a la vez: si ya hay
# una ejecucion en curso (p.ej. un workflow_dispatch manual solapado con el
# disparo programado), la nueva ejecucion espera en cola en vez de correr
# en paralelo y arriesgarse a que dos ejecuciones escriban a la vez sobre
# los mismos reports/ux-ui-landing-comparison/<changePackId>/.
concurrency:
  group: ux-ui-landing-architect-v2
  cancel-in-progress: false

# Principio de minimo privilegio: este empleado NUNCA escribe en el repo
# (no commit, no push, no PR, no comentarios en issues/PRs). Con
# `contents: read` alcanza -- ver .github/actions/claude-employee-runtime/action.yml
# para por que hace falta pasar `github-token` explicitamente al runtime
# comun (para que claude-code-action respete este limite en vez de pedir
# un token propio con permisos de escritura).
permissions:
  contents: read

jobs:
  run-landing-architect-v2:
    name: Ejecutar ux-ui-landing-architect-v2
    runs-on: ubuntu-latest
    # Backstop de tiempo en dos capas (ver docs/claude-employee-runtime.md,
    # seccion de timeouts): los steps INTERNOS de la composite action
    # (.github/actions/claude-employee-runtime/action.yml) no soportan
    # timeout-minutes propio (no es un campo valido en runs.steps para
    # `using: composite`, verificado contra el JSON Schema oficial de
    # metadata de Actions). Pero el step del WORKFLOW CALLER que invoca
    # `uses: ./.github/actions/claude-employee-runtime` SI es un step
    # normal de `jobs.<job>.steps` y SI admite timeout-minutes -- ver mas
    # abajo, step "[RUNTIME] Ejecutar ux-ui-landing-architect-v2", que
    # recupera de forma practica el backstop de 10 min que existia antes
    # de mover la invocacion de Claude a la composite action. Este
    # timeout-minutes: 20 de aqui es el limite del JOB completo (incluye
    # los pasos de dominio antes y despues del runtime).
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # --- [DOMINIO] Paso 1 del runner: prepara UN change pack + contexto
      # V2 + v2-prompt.md -- src/core/landing-architect-v2-context.ts,
      # src/core/landing-architect-change-pack-selection.ts,
      # scripts/run-landing-architect-comparison.ts, sin modificar. ---
      - name: "[DOMINIO] Runner (paso 1): preparar change pack + contexto V2"
        id: prepare
        run: |
          set -o pipefail
          if [ -n "$CHANGE_PACK_ID" ]; then
            npm run landing-architect:compare -- --changePackId "$CHANGE_PACK_ID" 2>&1 | tee runner-step1.log
          else
            npm run landing-architect:compare -- 2>&1 | tee runner-step1.log
          fi
        env:
          CHANGE_PACK_ID: ${{ inputs.changePackId }}

      - name: "[DOMINIO] Parsear RUNNER_RESULT_JSON (paso 1)"
        id: step1
        run: npm run landing-architect:parse-runner-result-for-ci -- runner-step1.log

      - name: "[DOMINIO] Validar estado tras el paso 1 (pending_execution + prompt existe)"
        run: |
          if [ "$V2_STATUS" != "pending_execution" ]; then
            echo "::error::v2Status inesperado tras el paso 1 del runner: \"$V2_STATUS\" (se esperaba pending_execution). Abortando antes de invocar a Claude."
            exit 1
          fi
          if [ ! -f "$PROMPT_FILE_PATH" ]; then
            echo "::error::promptFilePath no existe en disco: $PROMPT_FILE_PATH"
            exit 1
          fi
          echo "OK: v2Status=pending_execution, promptFilePath existe ($PROMPT_FILE_PATH)."
        env:
          V2_STATUS: ${{ steps.step1.outputs.v2Status }}
          PROMPT_FILE_PATH: ${{ steps.step1.outputs.promptFilePath }}

      - name: "[DOMINIO] Leer contenido completo de v2-prompt.md"
        id: read_prompt
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.step1.outputs.promptFilePath }}

      # --- [RUNTIME COMUN] Autenticacion + invocacion de
      # claude-code-action (--agent ux-ui-landing-architect-v2) +
      # resolucion structured_output/fallback via execution_file +
      # validacion contra config/landing-architect-v2-output.schema.json.
      # Identico para cualquier empleado Claude futuro -- ver
      # docs/claude-employee-runtime.md. ---
      - name: "[RUNTIME] Ejecutar ux-ui-landing-architect-v2 (Claude Employee Runtime)"
        id: runtime
        # timeout-minutes SI es valido aqui (step normal del workflow
        # caller, no un step interno de la composite action) -- limita
        # TODA la composite action (auth + preflights + claude-code-action
        # + resolucion de salida) a 10 min, el mismo backstop practico que
        # tenia antes el step de Claude en solitario. Futuros empleados
        # deben copiar este mismo timeout-minutes: 10 salvo necesidad
        # explicitamente justificada (ver docs/claude-employee-runtime.md).
        timeout-minutes: 22
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: ux-ui-landing-architect-v2
          health-record-path: ${{ runner.temp }}/claude-runtime-health/ux-ui-landing-architect-v2/claude-runtime-health.json
          prompt: ${{ steps.read_prompt.outputs.content }}
          output-schema-path: config/landing-architect-v2-output.schema.json
          expected-output-path: ${{ steps.step1.outputs.expectedV2OutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      # --- [DOMINIO] Paso 2 del runner: valida contra LandingArchitectV2Output
      # + audita fabricacion + comparacion V1/V2 -- sin modificar. Sale con
      # codigo != 0 (sin continue-on-error) si v2Status queda en
      # "invalid_output". El fichero que lee (expectedV2OutputPath) ya lo
      # escribio el runtime comun en el step anterior. ---
      - name: "[DOMINIO] Runner (paso 2): validar salida de Claude + auditar fabricacion + comparacion V1/V2"
        run: |
          set -o pipefail
          npm run landing-architect:compare -- --changePackId "$CHANGE_PACK_ID" --v2-output "$EXPECTED_V2_OUTPUT_PATH" 2>&1 | tee runner-step2.log
        env:
          CHANGE_PACK_ID: ${{ steps.step1.outputs.changePackId }}
          EXPECTED_V2_OUTPUT_PATH: ${{ steps.step1.outputs.expectedV2OutputPath }}

      - name: "[DOMINIO] Parsear RUNNER_RESULT_JSON (paso 2)"
        id: step2
        run: npm run landing-architect:parse-runner-result-for-ci -- runner-step2.log

      - name: "[DOMINIO] Subir artifact (comparison.json, comparison.md, v2-output.json)"
        uses: actions/upload-artifact@v4
        with:
          name: ux-ui-landing-architect-v2-${{ steps.step2.outputs.changePackId }}
          path: |
            ${{ steps.step2.outputs.comparisonJsonPath }}
            ${{ steps.step2.outputs.comparisonMdPath }}
            ${{ steps.step1.outputs.expectedV2OutputPath }}
          if-no-files-found: error
          retention-days: 90

      - name: "[DOMINIO] Generar GitHub Step Summary"
        run: |
          {
            echo "## UX/UI Landing Architect v2"
            echo ""
            echo "- **changePackId:** \`$CHANGE_PACK_ID\`"
            echo "- **keyword:** $KEYWORD"
            echo "- **Claude execution (outcome del step, sin enmascarar por continue-on-error):** $CLAUDE_OUTCOME"
            echo "- **Origen de la salida V2:** $V2_SOURCE"
            echo "- **v2Status:** \`$V2_STATUS\`"
            echo "- **fabricationWarnings:** $FABRICATION_WARNING_COUNT"
            echo "- **artifact generado:** \`ux-ui-landing-architect-v2-$CHANGE_PACK_ID\`"
            echo "- **Escritura externa realizada:** ninguna (WordPress/staging/produccion/Ads/GA4/GTM/Search Console/n8n/VPS no se han tocado; nada se ha commiteado)."
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ "$FABRICATION_WARNING_COUNT" != "0" ] && [ "$FABRICATION_WARNING_COUNT" != "null" ]; then
              echo "> ⚠️ Hay avisos de posible fabricacion de datos sin respaldo en el input (listados abajo, y tambien en \`comparison.md\` del artifact) -- revisar antes de dar por buena esta propuesta. No se han descartado ni reinterpretado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CHANGE_PACK_ID: ${{ steps.step2.outputs.changePackId }}
          KEYWORD: ${{ steps.step2.outputs.keyword }}
          V2_STATUS: ${{ steps.step2.outputs.v2Status }}
          FABRICATION_WARNING_COUNT: ${{ steps.step2.outputs.fabricationWarningCount }}
          # steps.runtime.outputs.claude-outcome / .output-source: outputs
          # declarados por la composite action del runtime comun (ver
          # .github/actions/claude-employee-runtime/action.yml) -- mismo
          # significado que antes (steps.claude.outcome / caso A-B-C), solo
          # que ahora vienen de la composite action, no de un step propio
          # de este workflow.
          CLAUDE_OUTCOME: ${{ steps.runtime.outputs.claude-outcome }}
          V2_SOURCE: ${{ steps.runtime.outputs.output-source == 'structured_output' && 'structured_output directo (caso A)' || (steps.runtime.outputs.output-source == 'execution_file_fallback' && 'fallback via execution_file (caso B)' || 'ninguno (caso C, el workflow ya deberia haber fallado antes de este step)') }}

      # --- [DOMINIO] Muestra los fabricationWarnings REALES (leidos tal
      # cual de comparison.json via extractFabricationWarnings(),
      # src/core/comparison-artifact-reader.ts) en el Step Summary cuando
      # los hay -- nunca se le pide a Claude que los resuma ni
      # reinterprete. No escribe nada (y no falla) si el array esta
      # vacio. ---
      - name: "[DOMINIO] Mostrar fabricationWarnings reales en el Step Summary (si los hay)"
        run: npm run landing-architect:print-fabrication-warnings-for-ci -- "$COMPARISON_JSON_PATH"
        env:
          COMPARISON_JSON_PATH: ${{ steps.step2.outputs.comparisonJsonPath }}

      # --- [RUNTIME] Fiabilidad del runtime comun: agrega los
      # diagnosticos por invocacion (claude-runtime-health.json) de esta
      # pasada y los sube como artifact.
      #
      # `always()`: una pasada que FALLO es justo la que mas interesa
      # poder auditar despues. El agregador es fail-soft a proposito (no
      # puede tumbar el job): la autoridad sobre si el empleado fallo
      # sigue siendo el step del runtime, no esta metrica. ---
      - name: "[RUNTIME] Metricas de fiabilidad del runtime comun"
        if: always()
        run: npm run claude-runtime:metrics-for-ci -- "$HEALTH_DIR" "$HEALTH_DIR/claude-runtime-metrics.json" "Fiabilidad del runtime -- ux-ui-landing-architect-v2"
        env:
          HEALTH_DIR: ${{ runner.temp }}/claude-runtime-health

      - name: "[RUNTIME] Subir diagnostico de fiabilidad del runtime"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-runtime-health-ux-ui-landing-architect-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-runtime-health/
          if-no-files-found: warn
          retention-days: 30
