name: Zentry AI Department -- Daily Brief (coordinacion real)

# Pasada COORDINADA del departamento -- ver docs/department-coordination.md.
#
#   SEO ──────────┐
#   Content ───────┼──> Growth Director ──> QA Reviewer ──> Web Engineer ──> DAILY BRIEF
#   Analytics ─────┘
#
# Un unico JOB a proposito: todas las etapas comparten el mismo
# $GITHUB_WORKSPACE y por tanto el mismo directorio de la pasada
# (reports/department/<departmentRunId>/), sin pasar ficheros entre jobs
# via artifacts ni buscar "el ultimo artifact" de una ejecucion historica
# ambigua. La informacion pasa de una etapa a la siguiente por FICHEROS
# JSON en rutas deterministas -- nunca por scraping de logs (la linea
# RUNNER_RESULT_JSON solo transporta RUTAS y ESTADO a este workflow,
# igual que ya hacen todos los empleados individuales).
#
# Este workflow NO implementa el runtime comun (auth, invocacion de
# claude-code-action, fallback via execution_file, validacion contra el
# JSON Schema versionado): eso lo hace, sin cambios,
# .github/actions/claude-employee-runtime/action.yml. Tampoco duplica la
# logica de dominio de ningun empleado: SEO/Content/Analytics/QA corren
# con SUS PROPIOS runners ya existentes, y Growth/Web Engineer usan sus
# validadores y auditorias de dominio ya existentes a traves de la capa
# de coordinacion (src/department/, scripts/run-department-coordination.ts).
#
# SEGURIDAD:
# - `contents: read` unicamente. Nada se commitea, nada se publica.
# - Los seis empleados Claude siguen siendo READ / ANALYZE / PROPOSE: no
#   escriben en WordPress, staging, produccion, Google Ads, GA4/GTM,
#   Search Console ni n8n.
# - Sin MCP, sin bypassPermissions, sin `id-token: write`.
# - sem-specialist queda FUERA de esta fase: se registra siempre como
#   not_available (pendiente) y nunca bloquea la pasada.
# - APPLY: esta pasada NO escribe en ningun sistema externo. Solo
#   PLANIFICA el contrato de apply (que recomendaciones tienen un executor
#   determinista detras) y lo publica numerado en el Daily Brief.
#
#   La ejecucion es MANUAL y posterior: Pau lee el email, responde en
#   Claude Code ("aprueba 1, 2 y 4; rechaza 3 porque..."), y solo entonces
#   se aplica lo aprobado, con snapshot, validacion y rollback. Ver
#   docs/manual-approval-flow.md.
#
#   Por tanto este workflow NO depende de Telegram, ni de Cloudflare, ni
#   de D1, ni de APPROVALS_API_*. Si esos secretos no existen, la pasada
#   diaria funciona exactamente igual y el email se envia igual. El carril
#   serverless queda como opcion desactivada
#   (SERVERLESS_APPROVALS_ENABLED=false, ver docs/serverless-approvals.md).
# - EMAIL: se envia el Daily Brief a la direccion configurada en los
#   secretos del repositorio. Si falta configuracion, no se envia nada y
#   se reporta que NOMBRES de variables faltan (nunca sus valores).
#
# SCHEDULE (fase EMAIL + SCHEDULE + APPLY): una unica ejecucion diaria a
# las 07:00 UTC -- aproximadamente las 09:00 en Espana en horario de
# verano (CEST, UTC+2) y las 08:00 en invierno (CET, UTC+1). Un solo cron,
# a proposito: nunca varias pasadas al dia. Se mantiene tambien
# `workflow_dispatch` para poder lanzarla a mano.
#
# GitHub Actions puede retrasar un `schedule` en momentos de carga: es un
# comportamiento conocido de la plataforma, no un fallo de esta pasada.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      skipLegacyRestore:
        description: >-
          No restaurar data/ ni reports/ desde la rama de estado. Prueba de
          que la continuidad ya NO depende del legacy: el estado sale
          entero de MongoDB. No borra nada -- la rama sigue intacta.
        required: false
        default: false
        type: boolean

# Una sola pasada coordinada a la vez: dos pasadas simultaneas podrian
# leer/escribir a la vez sobre los mismos registros del departamento.
concurrency:
  group: zentry-ai-department-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  department-run:
    name: Pasada coordinada del departamento
    runs-on: ubuntu-latest
    # Fase O55: el job de persistencia necesita el identificador de la
    # pasada para poder nombrar su commit con el mismo runId que todo lo
    # demas -- si no, el historial de la rama de estado no se podria
    # cruzar con el de las ejecuciones.
    outputs:
      departmentRunId: ${{ steps.run.outputs.departmentRunId }}
    # Seis invocaciones de Claude (SEO, Content, Analytics, Growth, QA,
    # Web Engineer), cada una acotada a 10 min en su propio step del
    # runtime comun, mas los pasos deterministas de coordinacion y, desde
    # la Fase O52, el pipeline determinista de 26 agentes que antes solo
    # corria en el VPS (hasta 30 min propios). 120 min es el backstop del
    # JOB completo.
    timeout-minutes: 120
    # Fase O56: el contexto `secrets` no esta disponible en el `if` de un
    # step, asi que la presencia de la credencial se materializa aqui como
    # un flag de entorno. El VALOR del secreto no entra en este env: solo
    # el booleano "esta puesto o no".
    env:
      MONGODB_CONFIGURED: ${{ secrets.MONGODB_URI != '' }}
      # Fase O57 -- CUTOVER. Con credenciales, MongoDB ES la fuente de
      # verdad: los lectores criticos leen de ahi y fallan CERRADOS si no
      # responde. Sin credenciales el modo sigue siendo `legacy` y el
      # comportamiento es exactamente el de antes, sin medias tintas.
      # Aqui solo viaja el MODO, nunca la credencial.
      DEPARTMENT_PERSISTENCE_MODE: ${{ secrets.MONGODB_URI != '' && 'mongo' || 'legacy' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # =====================================================================
      # FASE -1 -- RESTAURAR EL ESTADO DE LA PASADA ANTERIOR (Fase O55)
      #
      # Los runners de Actions son efimeros: sin este paso, cada pasada
      # partia del estado COMMITEADO EN main -- que solo actualizaba el
      # VPS legacy. Esa era la ultima dependencia real del VPS (ver
      # docs/vps-retirement-audit.md): el departamento leia en vivo y
      # generaba informes, pero no ACUMULABA.
      #
      # El estado vive ahora en la rama `department-state`, separada de
      # `main` a proposito: son commits de datos, no de codigo, y no
      # tienen por que ensuciar el historial del repositorio.
      #
      # Si la rama todavia no existe (primera pasada), se sigue con lo
      # que haya commiteado en main -- es el arranque en frio esperado,
      # no un fallo.
      # =====================================================================
      # Fase O57: con `skipLegacyRestore` este paso NO se ejecuta. Es la
      # prueba de la seccion 11 del cutover -- el runner arranca sin nada
      # heredado de la rama de estado y la pasada tiene que recuperar la
      # continuidad entera desde MongoDB. Es NO DESTRUCTIVO: la rama
      # `department-state` no se toca, solo se ignora en este run.
      - name: "[STATE] Restaurar data/ y reports/ desde la rama de estado"
        id: restore_state
        if: ${{ inputs.skipLegacyRestore != true }}
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            git checkout FETCH_HEAD -- data reports 2>/dev/null || true
            echo "Estado restaurado desde la rama \"$STATE_BRANCH\" (commit $(git rev-parse --short FETCH_HEAD))."
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::La rama \"$STATE_BRANCH\" todavia no existe. Arranque en frio: se parte del estado commiteado en main. Esto es normal en la primera pasada."
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STATE_BRANCH: department-state

      - name: "[STATE] Manifiesto ANTES de la pasada"
        if: ${{ inputs.skipLegacyRestore != true }}
        run: npm run state:snapshot -- --out "$RUNNER_TEMP/state-before.json"

      # =====================================================================
      # Fase O56 -- MongoDB. Sonda y foto del estado autoritativo ANTES.
      #
      # La sonda es fail-closed cuando hay credenciales: si estan puestas
      # pero el cluster no responde, mejor saberlo aqui que descubrirlo al
      # final, con la pasada ya hecha y sin sitio donde persistirla.
      # Mientras no haya `MONGODB_URI` el modo es "legacy" y los dos steps
      # se saltan solos, sin romper nada.
      # =====================================================================
      - name: "[MONGO] Sonda de MongoDB"
        id: mongo_probe
        if: ${{ env.MONGODB_CONFIGURED == 'true' }}
        run: npm run state:probe-mongodb -- --write-check
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}

      - name: "[MONGO] Foto del estado autoritativo ANTES de la pasada"
        if: ${{ env.MONGODB_CONFIGURED == 'true' }}
        run: npm run state:snapshot-mongodb -- --out "$RUNNER_TEMP/mongo-state-before.json"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}

      # =====================================================================
      # Fase O57 -- HIDRATACION: se invierte la direccion de la autoridad.
      #
      # Hasta aqui `data/` venia de la rama `department-state`. A partir de
      # este paso viene de MongoDB: la proyeccion SOBRESCRIBE los ficheros
      # de clase A y B con el estado autoritativo. Los derivados (clase C)
      # y los artifacts (clase D, `reports/`) no se tocan -- MongoDB no es
      # su fuente y sobrescribirlos seria destruir datos.
      #
      # Falla CERRADO: si MongoDB no responde, la pasada no arranca. Correr
      # sobre un `data/` de procedencia desconocida es peor que no correr.
      # =====================================================================
      - name: "[MONGO] Hidratar data/ desde el estado autoritativo"
        if: ${{ env.MONGODB_CONFIGURED == 'true' }}
        run: |
          set -o pipefail
          ARGS=()
          if [ "$SKIP_LEGACY_RESTORE" = "true" ]; then
            # Prueba de continuidad sin legacy: se borran los ficheros que
            # MongoDB posee ANTES de proyectar, para que no quede ninguna
            # duda de que el estado sale de Atlas y no del checkout.
            ARGS+=(--purge-first)
          fi
          npm run state:hydrate-mongodb -- "${ARGS[@]}" 2>&1 | tee mongo-hydrate.log
          {
            echo "## Hidratacion del estado desde MongoDB"
            echo ""
            sed -n '/^| fichero /,/^$/p' mongo-hydrate.log
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
          SKIP_LEGACY_RESTORE: ${{ inputs.skipLegacyRestore }}

      # =====================================================================
      # FASE 0 -- Abrir la pasada: un unico departmentRunId para todo el run
      # =====================================================================
      - name: "[COORD] Iniciar pasada coordinada (departmentRunId comun)"
        run: |
          set -o pipefail
          npm run department:run -- --phase init 2>&1 | tee coord-init.log

      - name: "[COORD] Parsear RUNNER_RESULT_JSON (init)"
        id: run
        run: npm run department:parse-runner-result-for-ci -- coord-init.log

      # =====================================================================
      # FASE 0.5 -- FUENTES LIVE (Fase O50, ver docs/external-dependencies-audit.md)
      #
      # POR QUE EXISTE: hasta esta fase, la pasada diaria de GitHub Actions
      # NO leia Google en vivo. Leia data/jobs.jsonl,
      # data/department-events.jsonl y reports/analytics/*.md tal y como
      # estaban COMMITEADOS en el repositorio — ficheros que generaba el
      # VPS legacy con su propio `.env`. Es decir: el "departamento
      # independiente" razonaba en realidad sobre snapshots del VPS, y sin
      # ninguna senal de su antigüedad.
      #
      # Estos dos steps mueven la RECOLECCION a Actions: los watchers
      # deterministas hablan con la API de Google aqui dentro, con el
      # MISMO departmentRunId de la pasada, y dejan el snapshot fresco que
      # leeran despues los especialistas. La separacion se mantiene
      # intacta: recoleccion = codigo determinista (estos steps),
      # razonamiento = agentes Claude (fases 1 en adelante). Ningun
      # especialista recibe credenciales de Google, ni antes ni ahora.
      #
      # `continue-on-error: true` a proposito: si faltan credenciales o la
      # API falla, la pasada NO se cae — pero tampoco finge. El snapshot
      # anterior queda etiquetado con su antigüedad real
      # (src/core/snapshot-freshness.ts) y el especialista lo recibe
      # marcado como `stale` en la cabecera de su prompt. Lo que se elimina
      # es el fallback SILENCIOSO, no el fallback.
      #
      # SOLO LECTURA: searchanalytics.query, properties.runReport,
      # accounts/containers/workspaces .list/.get/.live. Ni un solo metodo
      # de escritura existe en los adaptadores que usan.
      #
      # SEM/Google Ads queda FUERA a proposito (sigue fuera de fase): aqui
      # solo se ha identificado su infraestructura de datos, no se
      # reactiva. Ver docs/external-dependencies-audit.md.
      # =====================================================================
      - name: "[LIVE] Search Console -> snapshot de esta pasada (solo lectura)"
        id: live_gsc
        continue-on-error: true
        run: |
          set -o pipefail
          npm run seo:watch -- --departmentRunId "$DEPARTMENT_RUN_ID" --require-live 2>&1 | tee live-gsc.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          # Sin esto, resolveDataSource() cae a "mock" y el watcher
          # generaria jobs con datos de ejemplo. `--require-live` aborta
          # antes de leer nada si esta variable no dice search_console.
          SEO_DATA_SOURCE: search_console
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}

      - name: "[LIVE] GA4 + GTM -> snapshot de esta pasada (solo lectura)"
        id: live_analytics
        continue-on-error: true
        run: |
          set -o pipefail
          npm run analytics:watch -- --departmentRunId "$DEPARTMENT_RUN_ID" --require-live 2>&1 | tee live-analytics.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          # GA4 y GTM comparten el MISMO cliente OAuth (un unico cliente
          # con los dos scopes readonly) -- ver docs/analytics-readonly.md.
          GOOGLE_ANALYTICS_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_ANALYTICS_OAUTH_CLIENT_ID }}
          GOOGLE_ANALYTICS_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_ANALYTICS_OAUTH_CLIENT_SECRET }}
          GOOGLE_ANALYTICS_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_ANALYTICS_OAUTH_REFRESH_TOKEN }}

      # Google Ads (Fase O51). La RECOLECCION si se migra aqui: el watcher
      # lee la cuenta en vivo y deja el snapshot de esta pasada, igual que
      # SEO y Analytics. Lo que sigue fuera de fase es el AGENTE
      # sem-specialist dentro de la pasada coordinada, que se mantiene
      # como `not_available` mas abajo por decision explicita.
      #
      # READ-ONLY sin excepciones: el adaptador solo llama a
      # `googleAds:search` (GAQL de consulta). No existe ni una llamada
      # `:mutate` en todo el fichero, asi que este step no puede activar,
      # pausar, crear ni modificar ninguna campana, presupuesto, keyword
      # ni anuncio. La fase SEM-write no esta habilitada.
      - name: "[LIVE] Google Ads -> snapshot de esta pasada (solo lectura, 0 mutaciones)"
        id: live_ads
        continue-on-error: true
        run: |
          set -o pipefail
          npm run sem:watch -- --departmentRunId "$DEPARTMENT_RUN_ID" --require-live 2>&1 | tee live-ads.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_ADS_OAUTH_CLIENT_ID }}
          GOOGLE_ADS_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_OAUTH_CLIENT_SECRET }}
          GOOGLE_ADS_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_OAUTH_REFRESH_TOKEN }}

      - name: "[LIVE] Estado real de las fuentes de esta pasada"
        if: always()
        run: |
          echo "Search Console (seo-watcher): $GSC_OUTCOME"
          echo "GA4 + GTM (analytics-watcher): $ANALYTICS_OUTCOME"
          echo "Google Ads (sem-watcher): $ADS_OUTCOME"
          if [ "$GSC_OUTCOME" != "success" ] || [ "$ANALYTICS_OUTCOME" != "success" ] || [ "$ADS_OUTCOME" != "success" ]; then
            echo "::warning::Al menos una fuente Google NO se leyo en vivo en esta pasada. Los especialistas afectados recibiran el ultimo snapshot conocido ETIQUETADO con su antiguedad real (stale), nunca presentado como dato de hoy. Revisa los logs [LIVE] de arriba: dicen que NOMBRES de variable faltan, nunca sus valores."
          fi
        env:
          GSC_OUTCOME: ${{ steps.live_gsc.outcome }}
          ANALYTICS_OUTCOME: ${{ steps.live_analytics.outcome }}
          ADS_OUTCOME: ${{ steps.live_ads.outcome }}

      # =====================================================================
      # FASE 0.6 -- PIPELINE DETERMINISTA + GROWTH DIRECTOR v1 (Fase O52)
      #
      # POR QUE EXISTE: la auditoria de la Fase O50 dejo una dependencia
      # viva del VPS que no cerraba ninguna de las anteriores. Los
      # informes `reports/daily/executive-<fecha>.md` y
      # `technical-<fecha>.md` los genera growth-director v1, y v1 solo
      # corria dentro de `npm run growth:daily`, que solo lanzaba el timer
      # systemd del VPS. Apagar el VPS hoy significaba quedarse sin esos
      # dos informes, aunque todo lo demas siguiera funcionando.
      #
      # Este step ejecuta el MISMO pase de 26 agentes, aqui dentro y con
      # el departmentRunId de esta pasada, con tres diferencias:
      #
      #   --skip-watchers   Los pasos 1/6/7 ya corrieron en la FASE 0.5,
      #                     ademas con `--require-live`, que es MAS
      #                     estricto que este pase. Repetirlos serian
      #                     llamadas duplicadas a Google.
      #   --no-email        El correo lo envia el Daily Brief coordinado
      #                     al final de este mismo workflow. Dos correos
      #                     por pasada seria una regresion.
      #   sin flags de escritura  Los agentes que escriben
      #                     (wordpress-draft-agent, staging-executor,
      #                     production-draft-executor) son fail-closed por
      #                     diseno: exigen su variable puesta literalmente
      #                     a "true". Como este step NO las inyecta, esos
      #                     pasos se registran como no habilitados y no
      #                     tocan nada. Las credenciales de WordPress que
      #                     si se pasan son de LECTURA, para que el estado
      #                     que reporta el informe sea real y no "sin datos".
      #
      # Cada paso esta aislado (runPipelineStep): uno que falle se
      # registra y el pase continua, en vez de tumbar las 26 etapas.
      # =====================================================================
      - name: "[GROWTH-V1] Pipeline determinista + informes diarios de esta pasada"
        id: growth_v1
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          npm run growth:daily -- --departmentRunId "$DEPARTMENT_RUN_ID" --skip-watchers --no-email 2>&1 | tee growth-v1.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          # Solo lectura: sin WORDPRESS_DRAFTS_ENABLED / STAGING_EXECUTION_ENABLED /
          # PRODUCTION_* no se intenta ni una escritura.
          WORDPRESS_STAGING_BASE_URL: ${{ secrets.WORDPRESS_STAGING_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}

      - name: "[GROWTH-V1] Informes diarios generados en esta pasada"
        if: always()
        run: |
          if [ "$GROWTH_OUTCOME" != "success" ]; then
            echo "::warning::El pipeline determinista / Growth Director v1 no termino bien en esta pasada. Los informes reports/daily/ pueden faltar o estar incompletos. Ver el log del step [GROWTH-V1]."
          fi
          echo "Informes diarios presentes tras esta pasada:"
          find reports/daily -maxdepth 1 -name '*.md' -printf '%TY-%Tm-%Td %TH:%TM  %p\n' 2>/dev/null \
            | sort | tail -6 || echo "(sin directorio reports/daily)"
        env:
          GROWTH_OUTCOME: ${{ steps.growth_v1.outcome }}

      # =====================================================================
      # FASE 1 -- ESPECIALISTAS (SEO, Content, Analytics)
      # Cada uno corre con SU PROPIO runner, sin modificar. Un especialista
      # que falle o no tenga insumos NO tumba la pasada: se registra su
      # estado real y Growth lo recibe como ausencia explicita.
      # =====================================================================

      # --- SEO ---
      - name: "[SEO] Runner (paso 1): preparar contexto"
        id: seo1_run
        continue-on-error: true
        run: |
          set -o pipefail
          npm run seo-specialist:run 2>&1 | tee seo-step1.log
        env:
          # Fase O50: sin esto el especialista no puede distinguir "snapshot
          # generado en ESTA pasada" de "ultimo snapshot commiteado por el
          # VPS". Con esto, la cabecera de su prompt dice cual de las dos
          # cosas esta leyendo.
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}

      - name: "[SEO] Parsear RUNNER_RESULT_JSON (paso 1)"
        id: seo1
        continue-on-error: true
        if: steps.seo1_run.outcome == 'success'
        run: npm run seo-specialist:parse-runner-result-for-ci -- seo-step1.log

      - name: "[SEO] Leer prompt"
        id: seo_prompt
        continue-on-error: true
        if: steps.seo1.outputs.status == 'pending_execution'
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.seo1.outputs.promptFilePath }}

      - name: "[RUNTIME] Ejecutar seo-specialist (Claude Employee Runtime)"
        id: seo_runtime
        continue-on-error: true
        if: steps.seo_prompt.outcome == 'success' && steps.seo1.outputs.status == 'pending_execution'
        timeout-minutes: 10
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: seo-specialist
          execution-record-path: ${{ steps.run.outputs.runDir }}/stages/seo-specialist/claude-execution.json
          prompt: ${{ steps.seo_prompt.outputs.content }}
          output-schema-path: config/seo-specialist-output.schema.json
          expected-output-path: ${{ steps.seo1.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      - name: "[SEO] Runner (paso 2): validar salida + auditar"
        id: seo2_run
        continue-on-error: true
        if: steps.seo_runtime.outcome == 'success'
        run: |
          set -o pipefail
          npm run seo-specialist:run -- --runId "$RUN_ID" --seo-specialist-output "$EXPECTED_OUTPUT_PATH" 2>&1 | tee seo-step2.log
        env:
          RUN_ID: ${{ steps.seo1.outputs.runId }}
          EXPECTED_OUTPUT_PATH: ${{ steps.seo1.outputs.expectedOutputPath }}

      - name: "[SEO] Parsear RUNNER_RESULT_JSON (paso 2)"
        id: seo2
        continue-on-error: true
        if: steps.seo2_run.outcome == 'success' || steps.seo2_run.outcome == 'failure'
        run: npm run seo-specialist:parse-runner-result-for-ci -- seo-step2.log

      - name: "[COORD] Registrar etapa seo-specialist"
        if: always()
        run: |
          set -o pipefail
          if [ "$STEP2_STATUS" = "executed" ]; then
            STATUS=executed
            REASON="seo-specialist ejecutado en esta pasada. Avisos de auditoria de dominio: ${STEP2_WARNINGS}."
          elif [ "$STEP2_STATUS" = "invalid_output" ]; then
            STATUS=invalid_output
            REASON="seo-specialist devolvio una salida que no cumple su contrato -- descartada (fail-closed)."
          else
            STATUS=failed
            REASON="seo-specialist no completo su ejecucion (paso1=${STEP1_OUTCOME}, runtime=${RUNTIME_OUTCOME}, claude=${CLAUDE_OUTCOME:-n/a}, origen de salida=${OUTPUT_SOURCE:-ninguno}, paso2=${STEP2_OUTCOME}). No hay datos de SEO en esta pasada."
          fi
          ARGS=(--phase record-stage --departmentRunId "$DEPARTMENT_RUN_ID" --stage seo-specialist --status "$STATUS" --reason "$REASON")
          if [ -n "$OUTPUT_PATH" ]; then ARGS+=(--output "$OUTPUT_PATH"); fi
          if [ -n "$ARTIFACT_PATH" ]; then ARGS+=(--artifact "$ARTIFACT_PATH"); fi
          if [ -n "$STEP2_WARNINGS" ]; then ARGS+=(--audit-warnings "$STEP2_WARNINGS"); fi
          npm run department:run -- "${ARGS[@]}" 2>&1 | tee coord-seo.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          STEP1_OUTCOME: ${{ steps.seo1_run.outcome }}
          RUNTIME_OUTCOME: ${{ steps.seo_runtime.outcome }}
          # Outputs de la composite action del runtime comun: permiten
          # distinguir "Claude fallo" de "la entrega de la salida fallo"
          # sin leer miles de lineas de log.
          CLAUDE_OUTCOME: ${{ steps.seo_runtime.outputs.claude-outcome }}
          OUTPUT_SOURCE: ${{ steps.seo_runtime.outputs.output-source }}
          STEP2_OUTCOME: ${{ steps.seo2_run.outcome }}
          STEP2_STATUS: ${{ steps.seo2.outputs.status }}
          STEP2_WARNINGS: ${{ steps.seo2.outputs.warningCount }}
          OUTPUT_PATH: ${{ steps.seo2.outputs.status == 'executed' && steps.seo1.outputs.expectedOutputPath || '' }}
          ARTIFACT_PATH: ${{ steps.seo2.outputs.artifactJsonPath }}

      # --- CONTENT ---
      - name: "[CONTENT] Runner (paso 1): seleccionar change pack + preparar contexto"
        id: content1_run
        continue-on-error: true
        run: |
          set -o pipefail
          npm run content-strategist:run 2>&1 | tee content-step1.log
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}

      - name: "[CONTENT] Parsear RUNNER_RESULT_JSON (paso 1)"
        id: content1
        continue-on-error: true
        if: steps.content1_run.outcome == 'success'
        run: npm run content-strategist:parse-runner-result-for-ci -- content-step1.log

      - name: "[CONTENT] Leer prompt"
        id: content_prompt
        continue-on-error: true
        if: steps.content1.outputs.status == 'pending_execution'
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.content1.outputs.promptFilePath }}

      - name: "[RUNTIME] Ejecutar content-strategist (Claude Employee Runtime)"
        id: content_runtime
        continue-on-error: true
        if: steps.content_prompt.outcome == 'success' && steps.content1.outputs.status == 'pending_execution'
        timeout-minutes: 10
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: content-strategist
          execution-record-path: ${{ steps.run.outputs.runDir }}/stages/content-strategist/claude-execution.json
          prompt: ${{ steps.content_prompt.outputs.content }}
          output-schema-path: config/content-strategist-output.schema.json
          expected-output-path: ${{ steps.content1.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      - name: "[CONTENT] Runner (paso 2): validar salida + auditar"
        id: content2_run
        continue-on-error: true
        if: steps.content_runtime.outcome == 'success'
        run: |
          set -o pipefail
          npm run content-strategist:run -- --changePackId "$CHANGE_PACK_ID" --content-strategist-output "$EXPECTED_OUTPUT_PATH" 2>&1 | tee content-step2.log
        env:
          CHANGE_PACK_ID: ${{ steps.content1.outputs.changePackId }}
          EXPECTED_OUTPUT_PATH: ${{ steps.content1.outputs.expectedOutputPath }}

      - name: "[CONTENT] Parsear RUNNER_RESULT_JSON (paso 2)"
        id: content2
        continue-on-error: true
        if: steps.content2_run.outcome == 'success' || steps.content2_run.outcome == 'failure'
        run: npm run content-strategist:parse-runner-result-for-ci -- content-step2.log

      - name: "[COORD] Registrar etapa content-strategist"
        if: always()
        run: |
          set -o pipefail
          if [ "$STEP2_STATUS" = "executed" ]; then
            STATUS=executed
            REASON="content-strategist ejecutado sobre el change pack ${CHANGE_PACK_ID}. Avisos de auditoria: ${STEP2_WARNINGS}."
          elif [ "$STEP2_STATUS" = "invalid_output" ]; then
            STATUS=invalid_output
            REASON="content-strategist devolvio una salida que no cumple su contrato -- descartada (fail-closed)."
          elif [ "$STEP1_STATUS" = "no_eligible_work" ]; then
            STATUS=not_available
            REASON="No hay ningun change pack de contenido elegible (ready_for_review/approved_to_execute) en esta pasada. No se ha fabricado ninguna oportunidad."
          else
            STATUS=failed
            REASON="content-strategist no completo su ejecucion (paso1=${STEP1_OUTCOME}, runtime=${RUNTIME_OUTCOME}, claude=${CLAUDE_OUTCOME:-n/a}, origen de salida=${OUTPUT_SOURCE:-ninguno}, paso2=${STEP2_OUTCOME}). No hay datos de contenido en esta pasada."
          fi
          ARGS=(--phase record-stage --departmentRunId "$DEPARTMENT_RUN_ID" --stage content-strategist --status "$STATUS" --reason "$REASON")
          if [ -n "$OUTPUT_PATH" ]; then ARGS+=(--output "$OUTPUT_PATH"); fi
          if [ -n "$ARTIFACT_PATH" ]; then ARGS+=(--artifact "$ARTIFACT_PATH"); fi
          if [ -n "$STEP2_WARNINGS" ]; then ARGS+=(--audit-warnings "$STEP2_WARNINGS"); fi
          npm run department:run -- "${ARGS[@]}" 2>&1 | tee coord-content.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          STEP1_OUTCOME: ${{ steps.content1_run.outcome }}
          STEP1_STATUS: ${{ steps.content1.outputs.status }}
          RUNTIME_OUTCOME: ${{ steps.content_runtime.outcome }}
          # Outputs de la composite action del runtime comun: permiten
          # distinguir "Claude fallo" de "la entrega de la salida fallo"
          # sin leer miles de lineas de log.
          CLAUDE_OUTCOME: ${{ steps.content_runtime.outputs.claude-outcome }}
          OUTPUT_SOURCE: ${{ steps.content_runtime.outputs.output-source }}
          STEP2_OUTCOME: ${{ steps.content2_run.outcome }}
          STEP2_STATUS: ${{ steps.content2.outputs.status }}
          STEP2_WARNINGS: ${{ steps.content2.outputs.auditWarningCount }}
          CHANGE_PACK_ID: ${{ steps.content1.outputs.changePackId }}
          OUTPUT_PATH: ${{ steps.content2.outputs.status == 'executed' && steps.content1.outputs.expectedOutputPath || '' }}
          ARTIFACT_PATH: ${{ steps.content2.outputs.artifactJsonPath }}

      # --- ANALYTICS ---
      - name: "[ANALYTICS] Runner (paso 1): leer snapshot de analytics-watcher + preparar contexto"
        id: analytics1_run
        continue-on-error: true
        run: |
          set -o pipefail
          npm run analytics-specialist:run 2>&1 | tee analytics-step1.log
        env:
          # Fase O50 -- ver la nota del step equivalente de SEO.
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}

      - name: "[ANALYTICS] Parsear RUNNER_RESULT_JSON (paso 1)"
        id: analytics1
        continue-on-error: true
        if: steps.analytics1_run.outcome == 'success'
        run: npm run analytics-specialist:parse-runner-result-for-ci -- analytics-step1.log

      - name: "[ANALYTICS] Leer prompt"
        id: analytics_prompt
        continue-on-error: true
        if: steps.analytics1.outputs.status == 'pending_execution'
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.analytics1.outputs.promptFilePath }}

      - name: "[RUNTIME] Ejecutar analytics-specialist (Claude Employee Runtime)"
        id: analytics_runtime
        continue-on-error: true
        if: steps.analytics_prompt.outcome == 'success' && steps.analytics1.outputs.status == 'pending_execution'
        timeout-minutes: 10
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: analytics-specialist
          execution-record-path: ${{ steps.run.outputs.runDir }}/stages/analytics-specialist/claude-execution.json
          prompt: ${{ steps.analytics_prompt.outputs.content }}
          output-schema-path: config/analytics-specialist-output.schema.json
          expected-output-path: ${{ steps.analytics1.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      - name: "[ANALYTICS] Runner (paso 2): validar salida + auditar"
        id: analytics2_run
        continue-on-error: true
        if: steps.analytics_runtime.outcome == 'success'
        run: |
          set -o pipefail
          npm run analytics-specialist:run -- --analytics-specialist-output "$EXPECTED_OUTPUT_PATH" 2>&1 | tee analytics-step2.log
        env:
          EXPECTED_OUTPUT_PATH: ${{ steps.analytics1.outputs.expectedOutputPath }}

      - name: "[ANALYTICS] Parsear RUNNER_RESULT_JSON (paso 2)"
        id: analytics2
        continue-on-error: true
        if: steps.analytics2_run.outcome == 'success' || steps.analytics2_run.outcome == 'failure'
        run: npm run analytics-specialist:parse-runner-result-for-ci -- analytics-step2.log

      - name: "[COORD] Registrar etapa analytics-specialist"
        if: always()
        run: |
          set -o pipefail
          if [ "$STEP2_STATUS" = "executed" ]; then
            STATUS=executed
            REASON="analytics-specialist ejecutado sobre el snapshot real ${SOURCE_RUN_ID}. Avisos de auditoria: ${STEP2_WARNINGS}."
          elif [ "$STEP2_STATUS" = "invalid_output" ]; then
            STATUS=invalid_output
            REASON="analytics-specialist devolvio una salida que no cumple su contrato -- descartada (fail-closed)."
          elif [ "$STEP1_STATUS" = "no_analytics_data" ]; then
            STATUS=not_available
            REASON="No hay ningun snapshot de analytics-watcher en este repositorio. Sin datos reales de GA4/GTM en esta pasada."
          else
            STATUS=failed
            REASON="analytics-specialist no completo su ejecucion (paso1=${STEP1_OUTCOME}, runtime=${RUNTIME_OUTCOME}, claude=${CLAUDE_OUTCOME:-n/a}, origen de salida=${OUTPUT_SOURCE:-ninguno}, paso2=${STEP2_OUTCOME}). No hay datos de analitica en esta pasada."
          fi
          ARGS=(--phase record-stage --departmentRunId "$DEPARTMENT_RUN_ID" --stage analytics-specialist --status "$STATUS" --reason "$REASON")
          if [ -n "$OUTPUT_PATH" ]; then ARGS+=(--output "$OUTPUT_PATH"); fi
          if [ -n "$ARTIFACT_PATH" ]; then ARGS+=(--artifact "$ARTIFACT_PATH"); fi
          if [ -n "$SOURCE_RUN_ID" ]; then ARGS+=(--source-run-id "$SOURCE_RUN_ID"); fi
          if [ -n "$STEP2_WARNINGS" ]; then ARGS+=(--audit-warnings "$STEP2_WARNINGS"); fi
          npm run department:run -- "${ARGS[@]}" 2>&1 | tee coord-analytics.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          STEP1_OUTCOME: ${{ steps.analytics1_run.outcome }}
          STEP1_STATUS: ${{ steps.analytics1.outputs.status }}
          RUNTIME_OUTCOME: ${{ steps.analytics_runtime.outcome }}
          # Outputs de la composite action del runtime comun: permiten
          # distinguir "Claude fallo" de "la entrega de la salida fallo"
          # sin leer miles de lineas de log.
          CLAUDE_OUTCOME: ${{ steps.analytics_runtime.outputs.claude-outcome }}
          OUTPUT_SOURCE: ${{ steps.analytics_runtime.outputs.output-source }}
          STEP2_OUTCOME: ${{ steps.analytics2_run.outcome }}
          STEP2_STATUS: ${{ steps.analytics2.outputs.status }}
          STEP2_WARNINGS: ${{ steps.analytics2.outputs.auditWarningCount }}
          SOURCE_RUN_ID: ${{ steps.analytics2.outputs.departmentRunId }}
          OUTPUT_PATH: ${{ steps.analytics2.outputs.status == 'executed' && steps.analytics1.outputs.expectedOutputPath || '' }}
          ARTIFACT_PATH: ${{ steps.analytics2.outputs.artifactJsonPath }}

      # =====================================================================
      # FASE 2 -- GROWTH DIRECTOR: sintetiza las salidas REALES de los
      # especialistas de ESTA pasada (o su ausencia explicita).
      # =====================================================================
      - name: "[COORD] Preparar contexto de growth-director-v2 (con las salidas reales de los especialistas)"
        id: growth_prep_run
        continue-on-error: true
        run: |
          set -o pipefail
          npm run department:run -- --phase prepare-growth --departmentRunId "$DEPARTMENT_RUN_ID" 2>&1 | tee coord-growth-prepare.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}

      - name: "[COORD] Parsear RUNNER_RESULT_JSON (prepare-growth)"
        id: growth_prep
        continue-on-error: true
        if: steps.growth_prep_run.outcome == 'success'
        run: npm run department:parse-runner-result-for-ci -- coord-growth-prepare.log

      # Si la propia PREPARACION del contexto de Growth falla (excepcion en
      # la capa de coordinacion), eso es un fallo real, no una ausencia de
      # datos: se registra como `failed` para que el brief y el veredicto
      # final lo digan tal cual.
      - name: "[COORD] Registrar fallo de preparacion de growth-director-v2"
        if: always() && steps.growth_prep_run.outcome != 'success'
        run: |
          set -o pipefail
          npm run department:run -- --phase record-stage --departmentRunId "$DEPARTMENT_RUN_ID" --stage growth-director-v2 --status failed --reason "Fallo al preparar el contexto coordinado de Growth (ver el log del step [COORD] Preparar contexto de growth-director-v2)."
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}

      - name: "[GROWTH] Leer prompt"
        id: growth_prompt
        continue-on-error: true
        if: steps.growth_prep.outputs.claudeRequired == 'true'
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.growth_prep.outputs.promptFilePath }}

      - name: "[RUNTIME] Ejecutar growth-director-v2 (Claude Employee Runtime)"
        id: growth_runtime
        continue-on-error: true
        if: steps.growth_prompt.outcome == 'success' && steps.growth_prep.outputs.claudeRequired == 'true'
        timeout-minutes: 10
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: growth-director-v2
          execution-record-path: ${{ steps.run.outputs.runDir }}/stages/growth-director-v2/claude-execution.json
          prompt: ${{ steps.growth_prompt.outputs.content }}
          output-schema-path: config/growth-director-v2-output.schema.json
          expected-output-path: ${{ steps.growth_prep.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      - name: "[COORD] Validar y registrar la sintesis de growth-director-v2"
        id: growth_done
        continue-on-error: true
        if: always() && steps.growth_prep.outputs.claudeRequired == 'true'
        run: |
          set -o pipefail
          npm run department:run -- --phase complete-growth --departmentRunId "$DEPARTMENT_RUN_ID" --runtime-note "$RUNTIME_NOTE" 2>&1 | tee coord-growth-complete.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          RUNTIME_NOTE: "step=${{ steps.growth_runtime.outcome }}, claude=${{ steps.growth_runtime.outputs.claude-outcome }}, origen de salida=${{ steps.growth_runtime.outputs.output-source }}"

      # =====================================================================
      # FASE 3 -- QA REVIEWER: revisa especialistas + sintesis de Growth,
      # con SU PROPIO runner (--artifact-path), sin modificarlo.
      # =====================================================================
      - name: "[COORD] Preparar bundle de revision para qa-reviewer"
        id: qa_prep_run
        continue-on-error: true
        run: |
          set -o pipefail
          npm run department:run -- --phase prepare-qa --departmentRunId "$DEPARTMENT_RUN_ID" 2>&1 | tee coord-qa-prepare.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}

      - name: "[COORD] Parsear RUNNER_RESULT_JSON (prepare-qa)"
        id: qa_prep
        continue-on-error: true
        if: steps.qa_prep_run.outcome == 'success'
        run: npm run department:parse-runner-result-for-ci -- coord-qa-prepare.log

      - name: "[COORD] Registrar fallo de preparacion del bundle de QA"
        if: always() && steps.qa_prep_run.outcome != 'success'
        run: |
          set -o pipefail
          npm run department:run -- --phase record-stage --departmentRunId "$DEPARTMENT_RUN_ID" --stage qa-reviewer --status failed --reason "Fallo al preparar el bundle de revision de QA (ver el log del step [COORD] Preparar bundle de revision). Fail-closed: sin QA no se promueve nada."
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}

      - name: "[QA] Runner (paso 1): preparar prompt de revision"
        id: qa1_run
        continue-on-error: true
        if: steps.qa_prep.outputs.claudeRequired == 'true'
        run: |
          set -o pipefail
          npm run qa-reviewer:run -- --artifact-path "$QA_INPUT_PATH" 2>&1 | tee qa-step1.log
        env:
          QA_INPUT_PATH: ${{ steps.qa_prep.outputs.qaInputPath }}

      - name: "[QA] Parsear RUNNER_RESULT_JSON (paso 1)"
        id: qa1
        continue-on-error: true
        if: steps.qa1_run.outcome == 'success'
        run: npm run qa-reviewer:parse-runner-result-for-ci -- qa-step1.log

      - name: "[QA] Leer prompt"
        id: qa_prompt
        continue-on-error: true
        if: steps.qa1.outputs.qaStatus == 'pending_execution'
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.qa1.outputs.promptFilePath }}

      - name: "[RUNTIME] Ejecutar qa-reviewer (Claude Employee Runtime)"
        id: qa_runtime
        continue-on-error: true
        if: steps.qa_prompt.outcome == 'success' && steps.qa1.outputs.qaStatus == 'pending_execution'
        timeout-minutes: 10
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: qa-reviewer
          execution-record-path: ${{ steps.run.outputs.runDir }}/stages/qa-reviewer/claude-execution.json
          prompt: ${{ steps.qa_prompt.outputs.content }}
          output-schema-path: config/qa-reviewer-output.schema.json
          expected-output-path: ${{ steps.qa1.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      - name: "[QA] Runner (paso 2): validar la revision"
        id: qa2_run
        continue-on-error: true
        if: steps.qa_runtime.outcome == 'success'
        run: |
          set -o pipefail
          npm run qa-reviewer:run -- --artifact-path "$QA_INPUT_PATH" --qa-reviewer-output "$EXPECTED_OUTPUT_PATH" 2>&1 | tee qa-step2.log
        env:
          QA_INPUT_PATH: ${{ steps.qa_prep.outputs.qaInputPath }}
          EXPECTED_OUTPUT_PATH: ${{ steps.qa1.outputs.expectedOutputPath }}

      - name: "[QA] Parsear RUNNER_RESULT_JSON (paso 2)"
        id: qa2
        continue-on-error: true
        if: steps.qa2_run.outcome == 'success' || steps.qa2_run.outcome == 'failure'
        run: npm run qa-reviewer:parse-runner-result-for-ci -- qa-step2.log

      - name: "[COORD] Registrar QA y resolver la puerta (que se promueve a ingenieria)"
        id: qa_done
        continue-on-error: true
        if: always() && steps.qa_prep.outputs.claudeRequired == 'true'
        run: |
          set -o pipefail
          ARGS=(--phase complete-qa --departmentRunId "$DEPARTMENT_RUN_ID")
          if [ -n "$REVIEW_JSON_PATH" ]; then ARGS+=(--qa-review "$REVIEW_JSON_PATH"); fi
          if [ -n "$EXPECTED_OUTPUT_PATH" ]; then ARGS+=(--qa-output "$EXPECTED_OUTPUT_PATH"); fi
          ARGS+=(--runtime-note "$RUNTIME_NOTE")
          npm run department:run -- "${ARGS[@]}" 2>&1 | tee coord-qa-complete.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          RUNTIME_NOTE: "step=${{ steps.qa_runtime.outcome }}, claude=${{ steps.qa_runtime.outputs.claude-outcome }}, origen de salida=${{ steps.qa_runtime.outputs.output-source }}"
          REVIEW_JSON_PATH: ${{ steps.qa2.outputs.reviewJsonPath || steps.qa1.outputs.reviewJsonPath }}
          EXPECTED_OUTPUT_PATH: ${{ steps.qa1.outputs.expectedOutputPath }}

      - name: "[COORD] Parsear RUNNER_RESULT_JSON (complete-qa)"
        id: qa_gate
        continue-on-error: true
        if: steps.qa_done.outcome == 'success'
        run: npm run department:parse-runner-result-for-ci -- coord-qa-complete.log

      # =====================================================================
      # FASE 4 -- WEB ENGINEER: SOLO lo que sobrevivio Growth + QA.
      # Si QA bloqueo todo, este empleado NO se invoca (y se registra como
      # blocked, no como fallo).
      # =====================================================================
      # Lectura REAL de staging antes de especificar. SOLO LECTURA: el
      # adaptador que usa este paso no tiene ninguna funcion de
      # escritura, y la pasada diaria sigue siendo PLANIFICACION.
      # STAGING WRITES EN ESTE WORKFLOW = 0.
      - name: "[STAGING] Leer inventario real (solo lectura, 0 escrituras)"
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run staging:inventory -- --departmentRunId "$DEPARTMENT_RUN_ID" 2>&1 | tee coord-staging-inventory.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
          WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}

      - name: "[COORD] Preparar contexto de web-engineer (solo recomendaciones aprobadas)"
        id: web_prep_run
        continue-on-error: true
        run: |
          set -o pipefail
          npm run department:run -- --phase prepare-web-engineer --departmentRunId "$DEPARTMENT_RUN_ID" 2>&1 | tee coord-web-prepare.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}

      - name: "[COORD] Parsear RUNNER_RESULT_JSON (prepare-web-engineer)"
        id: web_prep
        continue-on-error: true
        if: steps.web_prep_run.outcome == 'success'
        run: npm run department:parse-runner-result-for-ci -- coord-web-prepare.log

      - name: "[COORD] Registrar fallo de preparacion de web-engineer"
        if: always() && steps.web_prep_run.outcome != 'success'
        run: |
          set -o pipefail
          npm run department:run -- --phase record-stage --departmentRunId "$DEPARTMENT_RUN_ID" --stage web-engineer --status failed --reason "Fallo al preparar el contexto de web-engineer (ver el log del step [COORD] Preparar contexto de web-engineer)."
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}

      - name: "[WEB] Leer prompt"
        id: web_prompt
        continue-on-error: true
        if: steps.web_prep.outputs.claudeRequired == 'true'
        run: |
          delim="PROMPT_EOF_${RANDOM}${RANDOM}"
          {
            echo "content<<$delim"
            cat "$PROMPT_FILE_PATH"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        env:
          PROMPT_FILE_PATH: ${{ steps.web_prep.outputs.promptFilePath }}

      - name: "[RUNTIME] Ejecutar web-engineer (Claude Employee Runtime)"
        id: web_runtime
        continue-on-error: true
        if: steps.web_prompt.outcome == 'success' && steps.web_prep.outputs.claudeRequired == 'true'
        timeout-minutes: 10
        uses: ./.github/actions/claude-employee-runtime
        with:
          agent-name: web-engineer
          execution-record-path: ${{ steps.run.outputs.runDir }}/stages/web-engineer/claude-execution.json
          prompt: ${{ steps.web_prompt.outputs.content }}
          output-schema-path: config/web-engineer-output.schema.json
          expected-output-path: ${{ steps.web_prep.outputs.expectedOutputPath }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}

      - name: "[COORD] Validar y registrar la especificacion tecnica de web-engineer"
        id: web_done
        continue-on-error: true
        if: always() && steps.web_prep.outputs.claudeRequired == 'true'
        run: |
          set -o pipefail
          npm run department:run -- --phase complete-web-engineer --departmentRunId "$DEPARTMENT_RUN_ID" --runtime-note "$RUNTIME_NOTE" 2>&1 | tee coord-web-complete.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          RUNTIME_NOTE: "step=${{ steps.web_runtime.outcome }}, claude=${{ steps.web_runtime.outputs.claude-outcome }}, origen de salida=${{ steps.web_runtime.outputs.output-source }}"

      # =====================================================================
      # FASE 4.5 -- PLANIFICACION DEL APPLY (determinista, sin Claude)
      #
      # Construye el contrato de apply de la pasada: por cada recomendacion,
      # si existe un executor determinista y reversible para ella. Esta fase
      # sigue sin escribir en ningun sistema externo. Ver
      # docs/serverless-approvals.md.
      #
      # `continue-on-error`: no poder planificar el apply degrada el informe,
      # pero nunca debe impedir que el Daily Brief se genere y se envie.
      # =====================================================================
      - name: "[APPLY] Planificar el contrato de apply de esta pasada (sin escribir en ningun sistema)"
        id: apply_plan
        continue-on-error: true
        if: always()
        run: |
          set -o pipefail
          npm run department:apply -- --phase plan --departmentRunId "$DEPARTMENT_RUN_ID" 2>&1 | tee coord-apply-plan.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          # SOLO LECTURA. Se lee la pagina objetivo de cada propuesta para
          # anclar su version: es lo que permite detectar mas tarde que
          # algo cambio desde el Daily Brief. No se escribe nada aqui --
          # los interruptores de escritura ni siquiera se pasan.
          WORDPRESS_STAGING_BASE_URL: ${{ secrets.WORDPRESS_STAGING_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}

      # =====================================================================
      # FASE 5 -- DAILY BRIEF (ensamblado determinista, sin Claude)
      # =====================================================================
      - name: "[COORD] Generar Daily Brief (JSON + Markdown + resumen)"
        id: brief_run
        if: always()
        run: |
          set -o pipefail
          npm run department:run -- --phase brief --departmentRunId "$DEPARTMENT_RUN_ID" 2>&1 | tee coord-brief.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}

      - name: "[COORD] Parsear RUNNER_RESULT_JSON (brief)"
        id: brief
        if: always() && steps.brief_run.outcome == 'success'
        run: npm run department:parse-runner-result-for-ci -- coord-brief.log

      # =====================================================================
      # FASE 6 -- EMAIL del Daily Brief
      #
      # Construye el correo (texto + HTML) a partir del brief YA generado y
      # lo envia por SMTP. Fail-closed: si falta cualquier variable de
      # configuracion, no se envia nada y se reportan los NOMBRES de las
      # variables que faltan -- nunca sus valores. Los secretos llegan como
      # env de ESTE step unicamente; el script no los imprime y verifica,
      # antes de escribir nada, que el correo construido no contiene el
      # valor de ninguna variable sensible.
      #
      # `continue-on-error`: un fallo del servidor de correo no puede
      # invalidar una pasada del departamento que ya termino bien.
      # =====================================================================
      - name: "[EMAIL] Enviar el Daily Brief"
        id: email
        continue-on-error: true
        if: always()
        run: |
          set -o pipefail
          npm run department:email -- --departmentRunId "$DEPARTMENT_RUN_ID" --runUrl "$RUN_URL" 2>&1 | tee coord-email.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DAILY_BRIEF_EMAIL_TO: ${{ secrets.DAILY_BRIEF_EMAIL_TO }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: "[COORD] Subir artifact de la pasada (manifiesto, etapas, promocion y Daily Brief)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentry-ai-department-${{ steps.run.outputs.departmentRunId }}
          path: ${{ steps.run.outputs.runDir }}
          if-no-files-found: error
          retention-days: 90

      # =====================================================================
      # FASE 7 -- PERSISTIR EL ESTADO (Fase O55)
      #
      # La verificacion va ANTES de empaquetar nada: si un fichero de
      # estado ha desaparecido o un .jsonl ha perdido lineas, este step
      # falla y NO se sube el artifact, asi que el job de persistencia no
      # tiene nada que commitear y la rama de estado conserva el ultimo
      # estado bueno. Los .jsonl del departamento son estrictamente
      # append-only (verificado sobre los 8 modulos que los escriben), asi
      # que perder lineas no es un caso raro a tolerar: es imposible en
      # una pasada sana, y por tanto un fallo real.
      # =====================================================================
      # =====================================================================
      # Fase O56 -- MongoDB. Escritura de la pasada y guard de invariantes.
      #
      # ORDEN DELIBERADO: primero se ESCRIBE en MongoDB y despues se
      # verifica, y las dos cosas van ANTES del guard legacy. Motivo: el
      # guard legacy tira la pasada entera si un `.md` de `reports/` ha
      # encogido, y no queremos que un artefacto regenerable impida que el
      # estado autoritativo llegue a la fuente de verdad.
      #
      # En modo shadow un fallo de MongoDB no tumba la pasada (la fuente de
      # verdad sigue siendo el fichero). En modo mongo, si.
      # =====================================================================
      - name: "[MONGO] Escribir el estado de la pasada en MongoDB"
        id: mongo_sync
        if: ${{ always() && env.MONGODB_CONFIGURED == 'true' }}
        run: |
          set -o pipefail
          npm run state:sync-mongodb -- \
            --departmentRunId "$DEPARTMENT_RUN_ID" \
            --status "$RUN_STATUS" 2>&1 | tee mongo-sync.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          RUN_STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}

      - name: "[MONGO] Verificar invariantes del estado autoritativo"
        id: verify_mongo_state
        if: ${{ always() && env.MONGODB_CONFIGURED == 'true' }}
        run: |
          set -o pipefail
          npm run state:verify-mongodb -- \
            --before "$RUNNER_TEMP/mongo-state-before.json" \
            --departmentRunId "$DEPARTMENT_RUN_ID" \
            --require-finished 2>&1 | tee mongo-state-verify.log
          {
            echo ""
            sed -n '/^## Verificacion del estado autoritativo/,/^MONGO_STATE_VERIFY_JSON=/p' mongo-state-verify.log \
              | grep -v '^MONGO_STATE_VERIFY_JSON='
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}

      # Sin restauracion legacy no hay foto ANTES con la que comparar, y
      # `data/` viene de MongoDB: comparar contra la nada solo produciria
      # ruido. La verificacion que SI importa en ese modo es la de
      # invariantes de MongoDB, que corre igual (arriba).
      - name: "[STATE] Verificar que la pasada no ha perdido estado"
        id: verify_state
        if: ${{ always() && inputs.skipLegacyRestore != true }}
        run: |
          set -o pipefail
          ARGS=(--before "$RUNNER_TEMP/state-before.json")
          if [ "$MONGODB_CONFIGURED" = "true" ]; then
            ARGS+=(--projection)
          fi
          npm run state:verify -- "${ARGS[@]}" 2>&1 | tee state-verify.log
          {
            echo ""
            sed -n '/^## Verificacion del estado/,/^STATE_VERIFY_JSON=/p' state-verify.log | grep -v '^STATE_VERIFY_JSON='
          } >> "$GITHUB_STEP_SUMMARY"

      # CRITICO — que se exporta a la rama y que no:
      #
      # En modo `skipLegacyRestore` no se empaqueta NADA, y por tanto el
      # job `persist-state` no corre: sin esa guarda, un `reports/` sin
      # restaurar se force-pusharia sobre la rama y borraria el historico.
      # La prueba de la seccion 11 es no destructiva justo por esto.
      #
      #   `reports/`  SIEMPRE. Son artifacts (clase D), MongoDB no es su
      #               fuente y la rama es el unico sitio donde se acumulan.
      #
      #   `data/`     SOLO en modo legacy. En modo `mongo` los ficheros de
      #               clase A son una PROYECCION del estado actual: subirlos
      #               force-pusharia 105 lineas encima de las 6.271 del
      #               historico append-only de la rama y BORRARIA versiones
      #               antiguas que ya no existen en ningun otro sitio.
      #               La rama conserva ese historico congelado e intacto;
      #               el estado vivo esta en MongoDB.
      # `upload-artifact` recorta la raiz comun de los paths que recibe: con
      # un unico directorio, su CONTENIDO acaba en la raiz del artifact y el
      # nombre de la carpeta se pierde. Por eso se monta antes un
      # `state-export/` explicito -- asi la raiz comun es esa carpeta y los
      # directorios de dentro conservan su nombre, venga uno o vengan dos.
      - name: "[STATE] Montar el paquete de estado a exportar"
        id: pack_state
        if: ${{ always() && steps.verify_state.outcome == 'success' && inputs.skipLegacyRestore != true }}
        run: |
          set -euo pipefail
          rm -rf state-export
          mkdir -p state-export
          cp -r reports state-export/reports
          if [ "$MONGODB_CONFIGURED" != "true" ]; then
            cp -r data state-export/data
            echo "Modo legacy: se exportan data/ y reports/."
          else
            echo "MongoDB es la fuente de verdad: se exporta SOLO reports/."
            echo "El data/ de la rama conserva su historico append-only sin tocar."
          fi
          echo "Contenido del paquete:"
          ls -1 state-export

      - name: "[STATE] Subir el paquete de estado"
        if: ${{ always() && steps.pack_state.outcome == 'success' && inputs.skipLegacyRestore != true }}
        uses: actions/upload-artifact@v4
        with:
          name: department-state-${{ github.run_id }}
          path: |
            state-export
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: "[COORD] GitHub Step Summary"
        if: always()
        run: |
          if [ -f "$STEP_SUMMARY_PATH" ]; then
            cat "$STEP_SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ZENTRY AI DEPARTMENT -- Daily Brief"
              echo ""
              echo "No se pudo generar el Daily Brief en esta pasada (\`$DEPARTMENT_RUN_ID\`). Ver el log del step \"[COORD] Generar Daily Brief\"."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Escrituras en sistemas de contenido:** NINGUNA. Esta pasada solo analiza y propone. Lo que se aplique se decide despues, a mano, sobre el Daily Brief numerado (ver docs/manual-approval-flow.md)."
            echo "- **Email del Daily Brief:** resultado del step [EMAIL] = \`${EMAIL_OUTCOME}\` (si falta configuracion, no se envia nada y el log dice que NOMBRES de variables faltan)."
            echo "- **SEM:** pendiente / fuera de esta fase por decision explicita."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}
          STEP_SUMMARY_PATH: ${{ steps.brief.outputs.stepSummaryPath }}
          EMAIL_OUTCOME: ${{ steps.email.outcome }}

      # Volcado al LOG del propio run: manifiesto + puerta + Daily Brief
      # completo, mas el diagnostico real de cada invocacion de Claude
      # (coste, turnos, y que devolvio cuando el runtime no pudo resolver
      # su salida). Todo son lecturas locales del runner -- ninguna llamada
      # externa. Existe porque el artifact no siempre es descargable desde
      # donde se opera el departamento, y sin esto un fallo dentro del
      # runtime solo era diagnosticable a ciegas.
      - name: "[COORD] Volcar manifiesto, Daily Brief y diagnostico de Claude al log"
        if: always()
        run: |
          set +e
          echo "===== MANIFEST ====="
          cat "$RUN_DIR/manifest.json" 2>/dev/null || echo "(sin manifest.json)"
          echo ""
          echo "===== PROMOTION (puerta de QA) ====="
          cat "$RUN_DIR/promotion.json" 2>/dev/null || echo "(sin promotion.json)"
          echo ""
          echo "===== APPLY (contrato de esta pasada) ====="
          cat "$RUN_DIR/apply-summary.json" 2>/dev/null || echo "(sin apply-summary.json)"
          echo ""
          echo "===== DAILY BRIEF (markdown) ====="
          cat "$RUN_DIR/department-daily-brief.md" 2>/dev/null || echo "(sin Daily Brief)"
          echo ""
          echo "===== COSTE POR EMPLEADO (un registro por invocacion, ya no se pisan entre si) ====="
          for f in "$RUN_DIR"/stages/*/claude-execution.json; do
            [ -f "$f" ] || continue
            echo "--- $f"
            cat "$f"
            echo ""
          done
          echo ""
          echo "===== DIAGNOSTICO DE LAS INVOCACIONES DE CLAUDE ====="
          find "$RUNNER_TEMP" -name "*execution*.json" -print 2>/dev/null | sort | while read -r f; do
            echo "--- $f ($(wc -c <"$f" 2>/dev/null) bytes)"
            jq -c 'if type=="array" then (.[-1] // {}) else . end | {type, subtype, is_error, num_turns, duration_ms, total_cost_usd}' "$f" 2>/dev/null || echo "(no parseable como JSON)"
            echo "    resultado (primeros 800 caracteres):"
            jq -r 'if type=="array" then ((.[-1] // {}).result // "") else (.result // "") end' "$f" 2>/dev/null | head -c 800
            echo ""
          done
        env:
          RUN_DIR: ${{ steps.run.outputs.runDir }}

      # Veredicto final: degradacion explicita (not_available/blocked) NO
      # tumba la pasada; una salida invalida o un fallo tecnico SI la
      # marcan en rojo, con el Daily Brief ya generado y subido.
      - name: "[COORD] Veredicto final de la pasada"
        if: always()
        run: |
          set -o pipefail
          npm run department:run -- --phase gate --departmentRunId "$DEPARTMENT_RUN_ID" 2>&1 | tee coord-gate.log
        env:
          DEPARTMENT_RUN_ID: ${{ steps.run.outputs.departmentRunId }}

  # =======================================================================
  # JOB 2 -- PERSISTIR EL ESTADO EN LA RAMA `department-state` (Fase O55)
  #
  # POR QUE UN JOB APARTE, y no un step mas del anterior: es el UNICO
  # sitio de todo el sistema que necesita `contents: write`. El job de
  # arriba ejecuta seis sesiones de Claude y se queda en `contents: read`,
  # como hasta ahora -- ningun empleado Claude puede escribir en el
  # repositorio, ni por accidente ni a proposito. Aqui no corre Claude, no
  # se llama a ninguna API externa y no se ejecuta codigo del repositorio:
  # solo se descarga el artifact ya verificado y se commitea.
  #
  # UN UNICO ESCRITOR: la rama `department-state` la escribe solo este
  # job. El `concurrency` del workflow (grupo zentry-ai-department-daily,
  # cancel-in-progress: false) serializa las pasadas completas, jobs
  # incluidos, asi que nunca hay dos de estos a la vez.
  #
  # `if: always()` NO se usa a proposito: si el job anterior fallo o la
  # verificacion detecto perdida de estado, no hay artifact que
  # descargar y NO se persiste nada. La rama conserva el ultimo estado
  # bueno, que es exactamente el comportamiento que se quiere.
  # =======================================================================
  persist-state:
    name: Persistir el estado del departamento
    needs: department-run
    # Fase O57: en la prueba sin legacy este job NO corre. El estado ya
    # esta en MongoDB; la rama es un export, y un export incompleto es
    # peor que ninguno.
    if: ${{ inputs.skipLegacyRestore != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout (solo para tener el remoto configurado)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar el estado verificado de la pasada
        uses: actions/download-artifact@v4
        with:
          name: department-state-${{ github.run_id }}
          path: incoming-state

      - name: "Commitear el estado en la rama dedicada"
        run: |
          set -euo pipefail

          git config user.name "zentry-department-bot"
          git config user.email "zentry-department-bot@users.noreply.github.com"

          # Rama huerfana la primera vez: la rama de estado no comparte
          # historia con main a proposito. Son datos, no codigo.
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            git checkout -B "$STATE_BRANCH" FETCH_HEAD
            echo "Rama de estado existente: partiendo de $(git rev-parse --short HEAD)."
          else
            git checkout --orphan "$STATE_BRANCH"
            git rm -rq --cached . 2>/dev/null || true
            echo "Creando la rama de estado \"$STATE_BRANCH\" por primera vez."
          fi

          # El working tree puede traer restos del checkout de main: se
          # limpia todo MENOS los directorios de estado, que ya vienen del
          # checkout de la rama y solo se sustituyen si el artifact los trae.
          find . -mindepth 1 -maxdepth 1 \
            -not -name '.git' -not -name 'incoming-state' \
            -not -name 'data' -not -name 'reports' \
            -exec rm -rf {} +

          # CRITICO: solo se reemplaza lo que el artifact TRAE. Desde el
          # cutover a MongoDB, `data/` no viaja en el artifact -- sus
          # ficheros de clase A son una proyeccion del estado ACTUAL (105
          # acciones) y sobrescribirian el historico append-only de la rama
          # (6.271 lineas), que es el unico sitio donde quedan las versiones
          # antiguas. Si no viene, el `data/` de la rama se queda intacto.
          PATHS=()
          for dir in data reports; do
            if [ -d "incoming-state/$dir" ]; then
              rm -rf "./$dir"
              mv "incoming-state/$dir" "./$dir"
              PATHS+=("$dir")
            elif [ -d "./$dir" ]; then
              echo "El artifact no trae \"$dir/\": la rama conserva el suyo, sin tocar."
            fi
          done
          rmdir incoming-state 2>/dev/null || true

          if [ ${#PATHS[@]} -eq 0 ]; then
            echo "::error::El artifact no traia ningun directorio de estado. No se commitea nada."
            exit 1
          fi

          git add -A "${PATHS[@]}"
          if git diff --cached --quiet; then
            echo "El estado no ha cambiado en esta pasada: no se crea ningun commit vacio."
            exit 0
          fi

          # Varios -m en vez de una cadena multilinea: dentro de un
          # bloque YAML, una linea sin indentar cerraria el bloque.
          git commit -q \
            -m "Estado del departamento tras la pasada ${DEPARTMENT_RUN_ID:-$GITHUB_RUN_ID}" \
            -m "Escrito por el job persist-state del workflow zentry-ai-department-daily." \
            -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -m "Los .jsonl de data/ son append-only y esta pasada ya ha superado la verificacion de no-perdida (npm run state:verify) antes de llegar aqui."

          # --force-with-lease en vez de --force: si otro escritor hubiera
          # tocado la rama entre el fetch y el push, el push se rechaza en
          # vez de pisarlo. No deberia ocurrir nunca (un unico escritor,
          # serializado por concurrency), y justo por eso interesa
          # enterarse si ocurre.
          for attempt in 1 2 3; do
            if git push --force-with-lease origin "HEAD:$STATE_BRANCH"; then
              echo "Estado persistido en \"$STATE_BRANCH\"."
              exit 0
            fi
            echo "Push rechazado (intento $attempt/3). Refrescando la rama y reintentando..."
            sleep $((attempt * 5))
            git fetch --depth=1 origin "$STATE_BRANCH" || true
          done
          echo "::error::No se pudo persistir el estado tras 3 intentos. La rama conserva el ultimo estado bueno; esta pasada NO se ha guardado."
          exit 1
        env:
          STATE_BRANCH: department-state
          DEPARTMENT_RUN_ID: ${{ needs.department-run.outputs.departmentRunId }}
